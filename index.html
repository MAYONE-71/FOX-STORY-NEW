*{box-sizing:border-box}body{margin:0;background:#e8e1d8;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;border:0;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}#app{max-width:1120px;margin:auto;min-height:100svh;background:var(--bg);box-shadow:0 8px 40px #65594d18}.page{display:none;min-height:100svh;padding:24px clamp(18px,5vw,62px) 42px;flex-direction:column;gap:14px}.page.active{display:flex}.home{align-items:center;justify-content:center;text-align:center}.home .foxHero{width:270px;height:330px;margin-bottom:2px}.home h1{font-size:clamp(34px,4vw,48px);margin:0}.home p{margin:0;color:var(--muted);font-size:21px}.btn{align-self:center;background:#ee9650;color:white;font-weight:800;font-size:21px;padding:13px 34px;border-radius:999px;min-height:58px;box-shadow:0 5px 0 #d87538;transition:.16s}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d87538}.title{text-align:center;font-size:clamp(29px,3.5vw,39px);font-weight:900;margin-top:2px}.subtitle{text-align:center;color:var(--muted);font-size:18px}.scene{position:relative;min-height:390px;flex:1;overflow:hidden;border-radius:30px;background:linear-gradient(#dcecf0 0 56%,#dbe9d3 56% 100%);box-shadow:inset 0 -24px 0 #b9d2aa55}.scene .hill{position:absolute;left:-10%;right:-10%;bottom:-13%;height:38%;background:#b7d1a8;border-radius:50% 50% 0 0/45% 45% 0 0}.sun{position:absolute;right:10%;top:8%;width:72px;height:72px;border-radius:50%;background:#f7d989;opacity:.8}.tree{position:absolute;left:5%;bottom:27%;width:105px;height:145px}.tree:before{content:"";position:absolute;left:43px;bottom:0;width:18px;height:75px;border-radius:12px;background:#9c7558}.tree:after{content:"";position:absolute;left:0;top:4px;width:105px;height:95px;border-radius:52% 48% 46% 54%;background:#b9d5ad;box-shadow:24px 19px 0 #a9ca9e}.bubble{position:absolute;z-index:20;left:50%;top:18px;transform:translateX(-50%);background:#fffdf8eF;border-radius:22px;padding:9px 19px;font-size:19px;font-weight:700;box-shadow:0 5px 16px #62564b12;max-width:82%;text-align:center}.char{position:absolute;z-index:8;cursor:pointer;transition:filter .2s}.char svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 5px #5d50462b)}.char:hover{filter:brightness(1.03)}.char.tap{animation:tap .42s cubic-bezier(.2,.8,.2,1)}@keyframes tap{0%{transform:scale(1)}35%{transform:translateY(-9px) scale(1.055) rotate(-1deg)}70%{transform:translateY(1px) scale(.99)}100%{transform:none}}.bear{width:235px;height:292px;left:17%;bottom:2%}.rabbit{width:225px;height:290px;right:17%;bottom:3%}.bearSmall{width:205px;height:255px;left:31%;bottom:-5%}.rabbitSmall{width:195px;height:252px;right:15%;bottom:0}.fox{position:absolute;z-index:12;width:150px;height:195px;right:3%;bottom:3%;cursor:pointer}.fox svg{width:100%;height:100%;filter:drop-shadow(0 8px 5px #5d50462b)}.fox.tap{animation:foxTap .45s ease}@keyframes foxTap{0%{transform:none}35%{transform:translateY(-12px) rotate(-4deg) scale(1.06)}70%{transform:rotate(2deg)}100%{transform:none}}.ball{position:absolute;z-index:10;left:49%;bottom:27%;width:74px;height:74px;cursor:pointer}.ball svg{width:100%;height:100%;filter:drop-shadow(0 6px 4px #5d50462b)}.ball.tap{animation:ballTap .48s ease}@keyframes ballTap{45%{transform:translateY(-9px) rotate(35deg) scale(1.08)}100%{transform:none}}.hint{background:#fffdf8;border-radius:18px;padding:9px 15px;text-align:center;color:var(--muted);font-size:17px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choice{min-height:110px;background:#fffdf8;border:2px solid transparent;border-radius:24px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-weight:800;font-size:21px;box-shadow:0 5px 13px #65594d10}.choice .face{font-size:40px}.choice.selected{border-color:var(--fox);background:#fff2e2;transform:translateY(-3px)}.foxText{background:#fffdf8;border-radius:21px;padding:11px 17px;text-align:center;font-size:19px;line-height:1.4;box-shadow:0 4px 12px #65594d10}.build{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.buildCard{min-height:116px;background:#fffdf8;border:2px solid transparent;border-radius:23px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;font-size:20px;font-weight:800;box-shadow:0 5px 13px #65594d10}.buildCard .face{font-size:38px}.buildCard.selected{border-color:var(--fox);background:#fff2e2}.sentence{background:#fff0dc;border:1.5px solid #efc89f;border-radius:22px;min-height:70px;padding:12px 18px;text-align:center;font-size:clamp(21px,2.6vw,29px);font-weight:800;line-height:1.45}.sentence .emotionWord{color:#d87538}.sentence .reasonWord{color:#6f9b75}.talkBtn{display:none;align-self:center;background:#9bbca4;color:white;font-weight:800;border-radius:999px;padding:11px 25px;font-size:19px;box-shadow:0 4px 0 #7d9f87}.talkBtn.show{display:block}.talkBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d9f87}.solutions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.solution{position:relative;min-height:235px;background:#fffdf8;border:2px solid transparent;border-radius:25px;overflow:hidden;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;box-shadow:0 6px 16px #65594d12}.solution.selected{border-color:var(--fox);transform:translateY(-3px)}.solutionArt{width:100%;height:175px;display:block}.solutionLabel{font-size:20px;font-weight:900;padding-bottom:5px}.result{background:#fffdf8;border-radius:20px;padding:12px 17px;text-align:center;font-size:18px;line-height:1.45;box-shadow:0 4px 12px #65594d10}.summary{align-items:center;justify-content:center;text-align:center}.summary .foxBig{width:210px;height:265px}.summary h2{font-size:32px;margin:0}.learn{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.learn span{background:#fffdf8;border-radius:18px;padding:9px 13px;font-size:18px}.stars{font-size:40px;letter-spacing:4px}@media(max-width:720px){.page{padding:18px 13px 34px}.scene{min-height:400px;border-radius:25px}.bubble{font-size:16px}.bear{left:2%;width:175px;height:220px}.rabbit{right:1%;width:170px;height:220px}.fox{width:105px;height:138px;right:1%;bottom:2%}.ball{width:57px;height:57px}.choices{grid-template-columns:1fr 1fr}.choice{min-height:95px;font-size:18px}.buildCard{min-height:105px;font-size:17px}.solutions{grid-template-columns:1fr}.solution{min-height:205px}.solutionArt{height:160px}.title{font-size:28px}.subtitle{font-size:16px}}

<div id="app">
<section class="page home active" id="p1"><svg class="foxHero" viewBox="0 0 240 300"><use href="#fox"/></svg><h1>小狐的心情故事</h1><p>你好，我是小狐</p><button class="btn" onclick="startStory()">开始故事</button></section>
<section class="page" id="p2"><div class="title">故事开始</div><div class="subtitle">下午，幼儿园的操场上</div><div class="scene" id="scene2"><div class="sun"></div><div class="tree"></div><div class="hill"></div><div class="bubble">小熊和小兔一起玩球。</div><div class="char bear" id="b2" onclick="tapChar(this,'小熊')"><svg viewBox="0 0 200 250"><use href="#bear"/></svg></div><div class="char rabbit" id="r2" onclick="tapChar(this,'小兔')"><svg viewBox="0 0 200 250"><use href="#rabbit"/></svg></div><div class="ball" onclick="tapBall(this)"><svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="29" fill="#fff" stroke="#7b685d" stroke-width="2"/><path d="M26 21l10-5 11 8-4 12H30Z" fill="#91b7ae"/><path d="M26 21 16 31M47 24l10 10M30 36 22 50M43 36l8 15" stroke="#7b685d" stroke-width="2" fill="none"/></svg></div></div><div class="hint">点一点，看看会发生什么。</div><button class="btn" onclick="go(3)">继续看看</button></section>
<section class="page" id="p3"><div class="title">小熊怎么了？</div><div class="subtitle">小熊坐到了一边</div><div class="scene"><div class="hill"></div><div class="bubble">小熊低着头。</div><div class="char bear" id="b3" onclick="tapChar(this,'我也想玩球……')"><svg viewBox="0 0 200 250"><use href="#bearSad"/></svg></div><div class="char rabbit" id="r3" onclick="tapChar(this,'小兔还在玩球。')"><svg viewBox="0 0 200 250"><use href="#rabbit"/></svg></div><div class="ball" style="left:auto;right:18%;bottom:27%"><svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="29" fill="#fff" stroke="#7b685d" stroke-width="2"/><path d="M26 21l10-5 11 8-4 12H30Z" fill="#91b7ae"/><path d="M26 21 16 31M47 24l10 10M30 36 22 50M43 36l8 15" stroke="#7b685d" stroke-width="2" fill="none"/></svg></div><div class="fox" onclick="foxTap(this,'我们一起看看小熊的感觉。')"><svg viewBox="0 0 240 300"><use href="#fox"/></svg></div></div><div class="foxText" id="p3text">小狐：你觉得小熊是什么感觉？</div><div class="choices"><button class="choice" onclick="emotion('生气',this)"><span class="face">😠</span>生气</button><button class="choice" onclick="emotion('难过',this)"><span class="face">😢</span>难过</button><button class="choice" onclick="emotion('委屈',this)"><span class="face">🥺</span>委屈</button><button class="choice" onclick="emotion('不知道',this)"><span class="face">🤔</span>不知道</button></div><button class="btn" id="p3next" style="display:none" onclick="go(4)">继续</button></section>
<section class="page" id="p4"><div class="title">帮小熊说出来</div><div class="subtitle">先说感觉，再说为什么</div><div class="scene" style="min-height:255px;flex:none"><div class="hill"></div><div class="char bearSmall"><svg viewBox="0 0 200 250"><use id="p4bear" href="#bearSad"/></svg></div><div class="char rabbitSmall"><svg viewBox="0 0 200 250"><use href="#rabbit"/></svg></div><div class="fox" onclick="foxTap(this,'先说说自己的感觉。')"><svg viewBox="0 0 240 300"><use href="#fox"/></svg></div><div id="talkBubble" class="bubble" style="display:none;top:24px"></div></div><div class="build"><button class="buildCard" id="emoBtn" onclick="chooseBuild('emo')"><span class="face">🥺</span><span id="emoLabel">我感到有一点难过</span></button><button class="buildCard" id="reasonBtn" onclick="chooseBuild('reason')"><span class="face">⚽</span>因为我也想玩球</button></div><div class="sentence" id="sentence">我感到……</div><button class="talkBtn" id="talkBtn" onclick="talkToRabbit()">告诉小兔</button><button class="btn" id="p4next" style="display:none" onclick="go(5)">继续</button></section>
<section class="page" id="p5"><div class="title">生气的时候，可以怎么做？</div><div class="subtitle">先停一下，看看会发生什么</div><div class="scene" id="scene5"><div class="hill"></div><div class="char bear" id="angryBear" onclick="tapChar(this,'我好生气！')"><svg viewBox="0 0 200 250"><use href="#bearAngry"/></svg></div><div class="char rabbit" id="sadRabbit" onclick="tapChar(this,'我好难过。')"><svg viewBox="0 0 200 250"><use href="#rabbit"/></svg></div><div class="fox" onclick="foxTap(this,'生气的时候，我们可以先停一停。')"><svg viewBox="0 0 240 300"><use href="#fox"/></svg></div><div id="impact" class="bubble" style="display:none">小兔难过了，小熊也不开心。</div></div><button class="talkBtn show" onclick="showImpact()">看看后来发生了什么</button><button class="btn" onclick="go(6)">再试一次</button></section>
<section class="page" id="p6"><div class="title">如果重新来一次？</div><div class="subtitle">点一张图片，看看小熊怎么做</div><div class="solutions">

<button class="solution" onclick="solution(3,this)"><svg class="solutionArt" viewBox="0 0 220 175"><rect x="0" y="0" width="220" height="175" rx="20" fill="#e8eef1"/><circle cx="110" cy="50" r="26" fill="#d1a27f"/><path d="M72 140q5-52 38-52t38 52" fill="#8fb0b8"/><circle cx="65" cy="106" r="25" fill="#c69270"/><circle cx="155" cy="106" r="25" fill="#f5eee6"/><path d="M84 104h52" stroke="#8fb0b8" stroke-width="6" stroke-linecap="round"/></svg><span class="solutionLabel">找老师帮忙</span></button>
</div><div class="result hide" id="result"></div><button class="btn hide" id="p6next" onclick="go(7)">继续</button></section>
<section class="page summary" id="p7"><svg class="foxBig" viewBox="0 0 240 300"><use href="#fox"/></svg><h2>今天你帮助小熊学会了</h2><div class="learn"><span>看见感觉</span><span>说出想法</span><span>找到办法</span></div><div class="stars">⭐ ⭐ ⭐</div><button class="btn" onclick="go(1)">再玩一次</button></section>

<script>
let ctx=null,selectedEmotion='难过';
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f=620,d=.08){try{const c=audio(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.06,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02)}catch(e){}}
function speak(t){tone();if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.9;u.pitch=1.08;speechSynthesis.speak(u)}}
function go(n){tone(680,.07);document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p'+n).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function startStory(){audio();speak('下午，幼儿园的操场上，小熊和小兔一起玩球。');go(2)}
function tapChar(el,text){el.classList.remove('tap');void el.offsetWidth;el.classList.add('tap');tone(760,.08);speak(text)}function tapBall(el){el.classList.remove('tap');void el.offsetWidth;el.classList.add('tap');speak('球滚过来啦！')}function foxTap(el,text){el.classList.remove('tap');void el.offsetWidth;el.classList.add('tap');tone(820,.09);speak(text)}
function emotion(v,el){selectedEmotion=v;document.querySelectorAll('#p3 .choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const m={生气:'你发现小熊可能有一点生气。',难过:'你发现小熊可能有一点难过。',委屈:'你发现小熊可能有一点委屈。',不知道:'没关系，我们可以再看看。'}[v];document.getElementById('p3text').textContent='小狐：'+m;document.getElementById('p3next').style.display='block';speak(m)}
function chooseBuild(which){tone(700,.07);const el=document.getElementById(which==='emo'?'emoBtn':'reasonBtn');el.classList.toggle('selected');const a=document.getElementById('emoBtn').classList.contains('selected'),b=document.getElementById('reasonBtn').classList.contains('selected');if(a&&b){document.getElementById('sentence').innerHTML='我感到<span class="emotionWord">有一点'+selectedEmotion+'</span>，因为<span class="reasonWord">我也想玩球</span>。';document.getElementById('talkBtn').classList.add('show');speak('我感到有一点'+selectedEmotion+'，因为我也想玩球。')}else{document.getElementById('sentence').textContent='我感到……';document.getElementById('talkBtn').classList.remove('show')}}
function talkToRabbit(){const bubble=document.getElementById('talkBubble');bubble.textContent='我们可以一起玩吗？';bubble.style.display='block';const bear=document.querySelector('#p4 .bearSmall'),rabbit=document.querySelector('#p4 .rabbitSmall');bear.classList.remove('tap');void bear.offsetWidth;bear.classList.add('tap');setTimeout(()=>{rabbit.classList.remove('tap');void rabbit.offsetWidth;rabbit.classList.add('tap');bubble.textContent='小兔：可以呀！';speak('我们可以一起玩吗？可以呀！');document.getElementById('p4next').style.display='block'},550)}
function showImpact(){const x=document.getElementById('impact');x.style.display='block';document.getElementById('sadRabbit').classList.add('tap');setTimeout(()=>document.getElementById('angryBear').classList.add('tap'),180);speak('小兔难过了，小熊自己也不开心。')}
function solution(n,el){document.querySelectorAll('.solution').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const r=document.getElementById('result');r.classList.remove('hide');document.getElementById('p6next').classList.remove('hide');if(n===1){r.innerHTML='小熊先停一停，等心里没有那么急。';speak('小熊先停一停。')}if(n===2){r.innerHTML='小熊说：“我感到有一点'+selectedEmotion+'，因为我也想玩球。我们可以一起玩吗？”';speak('我感到有一点'+selectedEmotion+'，因为我也想玩球。我们可以一起玩吗？')}if(n===3){r.innerHTML='小熊请老师来帮忙。';speak('不知道怎么办的时候，可以找老师帮忙。')}}
</script>
</body></html>
