<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小狐的心情故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf4e7;--ink:#5d5148;--soft:#88766a;--orange:#e58b4c;--scarf:#79a59e;--bear:#b98260;--rabbit:#fff8ed;--pink:#dca8ae;--green:#c7d59f;--blue:#dce7df;--line:#c9aa8e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8dfd1;color:var(--ink)}body{font-family:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",cursive,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}button:disabled{cursor:default;opacity:.55}#app{width:min(1120px,100%);margin:auto;min-height:100svh;background:var(--paper);position:relative;overflow:hidden}#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:radial-gradient(#8e735c .48px,transparent .7px);background-size:6px 6px;mix-blend-mode:multiply}
.page{display:none;min-height:100svh;padding:26px clamp(18px,5vw,66px) 34px;flex-direction:column;gap:12px;position:relative}.page.active{display:flex}.hide{display:none!important}
.home{align-items:center;justify-content:center;text-align:center;gap:8px}.home h1{font-size:48px;font-weight:400;margin:0;letter-spacing:2px}.home p{font-size:25px;color:var(--soft);margin:0 0 12px}.homeFox{width:220px;height:265px;animation:float 3s ease-in-out infinite}
.btn{background:#e79759;color:#fff;padding:12px 34px;min-height:56px;border-radius:26px;font-size:23px;box-shadow:0 4px 0 #c97847}.btn:active{transform:translateY(3px);box-shadow:none}.title{text-align:center;font-size:36px;font-weight:400}.sub{text-align:center;color:var(--soft);font-size:21px}
.scene{position:relative;min-height:430px;flex:1;overflow:hidden;border:1px solid #d4bea5;border-radius:26px;background:#dce7df}.scene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(167deg,transparent 0 20px,#bfa88b0d 21px 22px);pointer-events:none}.ground{position:absolute;left:-8%;right:-8%;bottom:-17%;height:37%;background:#c6d49f;border-radius:50% 50% 0 0}.sun{position:absolute;right:9%;top:8%;width:65px;height:65px;border-radius:50%;background:#f1cf87}.cloud{position:absolute;left:11%;top:13%;width:105px;height:27px;border-radius:30px;background:#fffaf099}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fffaf099}.cloud:before{width:45px;height:45px;left:14px;top:-18px}.cloud:after{width:35px;height:35px;left:53px;top:-12px}
.char{position:absolute;z-index:5;filter:drop-shadow(0 5px 3px #5d514916)}.char svg{width:100%;height:100%;overflow:visible}.bear{width:190px;height:235px;left:17%;bottom:7%}.rabbit{width:190px;height:235px;right:16%;bottom:7%}.fox{width:138px;height:180px;right:3%;bottom:4%;z-index:8}.dialog{position:absolute;z-index:20;left:50%;top:18px;transform:translateX(-50%);max-width:82%;min-width:230px;padding:10px 20px;background:#fffaf0ed;border:1.5px dashed #c8a98d;border-radius:23px;text-align:center;font-size:23px;line-height:1.4;opacity:0}.dialog.show{opacity:1;animation:pop .25s ease}.dialog.talk{animation:pop .25s ease,talk .55s ease-in-out infinite}.paper{background:#fffaf0dc;border:1.5px dashed #c9ad92;border-radius:23px}.storyFox{display:flex;justify-content:center;align-items:center;gap:12px}.storyFox svg{width:76px;height:100px;flex:none}.speech{padding:11px 18px;font-size:23px;line-height:1.45;max-width:760px}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choice{min-height:105px;padding:12px;background:#fffaf0d0;border:1.5px dashed #c9ad92;border-radius:22px;font-size:23px}.choice.selected{background:#fff0dc;border-style:solid;border-color:#e49a60}.face{font-size:37px;display:block}
.twoCols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.col{padding:14px}.colTitle{text-align:center;font-size:27px;margin-bottom:9px}.optionList{display:grid;gap:10px}.option{min-height:70px;padding:9px 13px;background:#fffaf0c9;border:1.5px dashed #c9ad92;border-radius:19px;font-size:22px}.option.selected{background:#fff0dc;border-style:solid;border-color:#e49a60}.sentence{padding:14px 20px;text-align:center;font-size:29px;line-height:1.5;background:#fff0dc;border:1.5px solid #dfb38a;border-radius:24px;min-height:76px}.voiceRow{text-align:center;display:flex;justify-content:center;gap:10px;align-items:center}.replay{background:#fffaf0;border:1px solid #c9ad92;border-radius:20px;padding:7px 14px;font-size:18px}
.solutions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.solution{background:#fffaf0;border:1.5px dashed #c9ad92;border-radius:23px;overflow:hidden}.solution.selected{border-style:solid;border-color:#e49a60;background:#fff0dc}.solution .pic{height:190px;background:#e5ecdc;display:flex;align-items:center;justify-content:center;overflow:hidden}.solution svg{width:94%;height:94%}.solution .label{text-align:center;padding:9px;font-size:22px}.result{text-align:center;font-size:22px;line-height:1.5;padding:12px 18px;min-height:58px}.tap{text-align:center;color:var(--soft);font-size:19px}.summary{align-items:center;justify-content:center;text-align:center}.summary h2{font-size:40px;font-weight:400;margin:0}.summary p{font-size:25px;line-height:1.6}
.outline{stroke:#715b4d;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round}.pencil{stroke:#866b58;stroke-width:1.05;fill:none;opacity:.43;stroke-linecap:round}.thin{stroke:#715b4d;stroke-width:1.7;fill:none;stroke-linecap:round}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pop{from{opacity:.2;transform:translateX(-50%) scale(.96)}to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes talk{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px) scale(1.015)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes look{0%{transform:translate(0,0)}45%{transform:translate(18px,-4px)}100%{transform:translate(0,0)}}@keyframes ballRoll{from{transform:translate(0,0) rotate(0)}to{transform:translate(250px,0) rotate(720deg)}}@keyframes stepLeft{0%{transform:translate(0,0)}45%{transform:translate(-45px,5px)}75%{transform:translate(-88px,10px)}100%{transform:translate(-125px,18px)}}@keyframes crouch{0%{transform:translate(-125px,18px)}100%{transform:translate(-125px,56px)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-4px) rotate(-1deg)}80%{transform:translateX(4px) rotate(1deg)}}@keyframes settle{0%{transform:translateY(0) scale(1)}100%{transform:translateY(9px) scale(.97)}}@keyframes reach{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes walkToTeacher{0%{transform:translate(0,0)}100%{transform:translate(35px,-6px)}}
.bob{animation:bob 1.1s ease-in-out 2}.look{animation:look .8s ease-in-out}.ballRoll{animation:ballRoll 1.2s cubic-bezier(.2,.75,.25,1) forwards}.stepLeft{animation:stepLeft 1.45s cubic-bezier(.2,.75,.25,1) forwards}.crouchMove{animation:crouch .55s ease forwards}.shake{animation:shake .65s ease-in-out}.settle{animation:settle .6s ease forwards}.reach{animation:reach .8s ease-in-out}.walkTeacher{animation:walkToTeacher 1s ease forwards}
.crouchPose{display:none}.crouched .standingPose{display:none}.crouched .crouchPose{display:block}
@media(max-width:720px){.page{padding:18px 13px 30px}.title{font-size:31px}.sub{font-size:19px}.scene{min-height:400px}.bear,.rabbit{width:145px;height:180px}.bear{left:3%}.rabbit{right:3%}.fox{width:100px;height:135px}.choices{grid-template-columns:1fr 1fr}.twoCols,.solutions{grid-template-columns:1fr}.solution .pic{height:150px}.home h1{font-size:39px}.sentence{font-size:23px}.dialog{font-size:20px}}
</style>
</head>

<section class="page home active" id="p1"><svg class="homeFox"><use href="#fox"/></svg><h1>小狐的心情故事</h1><p>你好，我是小狐</p><button class="btn" onclick="startStory()">开始故事</button></section>
<section class="page" id="p2"><div class="title">一起玩吧</div><div class="scene" id="scene2"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="toy" style="left:43%;bottom:27%;width:82px;height:54px"></div><div class="dialog" id="d2"></div><div class="char bear" id="b2"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r2"><svg><use href="#rabbit"/></svg></div><div class="ball" id="ball2" style="left:27%;bottom:28%;width:58px;height:58px"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fff8ed" stroke="#8b6b58" stroke-width="2.4"/><path d="M13 30Q34 19 55 30M20 49Q34 39 48 49" fill="none" stroke="#d69b6b" stroke-width="2"/><path d="M28 8Q34 20 40 8M28 60Q34 48 40 60" fill="none" stroke="#d69b6b" stroke-width="2"/></svg></div></div></section>
<section class="page" id="p3"><div class="title">发生了什么？</div><div class="scene" id="scene3"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="dialog" id="d3"></div><div class="char bear" id="b3"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r3"><svg><use href="#rabbit"/></svg></div><div class="ball" style="left:44%;bottom:30%;width:58px;height:58px"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fff8ed" stroke="#8b6b58" stroke-width="2.4"/><path d="M13 30Q34 19 55 30M20 49Q34 39 48 49" fill="none" stroke="#d69b6b" stroke-width="2"/></svg></div></div></section>
<section class="page" id="p4"><div class="title">小熊怎么了？</div><div class="scene" id="scene4"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="char bear crouched" id="b4"><div class="standingPose"><svg><use href="#bear"/></svg></div><div class="crouchPose"><svg><use href="#bearCrouch"/></svg></div></div><div class="char rabbit" id="r4"><svg><use href="#rabbit"/></svg></div><div class="char fox" id="f4"><svg><use href="#fox"/></svg></div></div><div class="storyFox"><svg><use href="#fox"/></svg><div class="speech paper" id="foxQuestion">你发现了吗？<br>小熊好像和刚才不一样了。</div></div><div class="choices" id="emotionChoices"><button class="choice" onclick="chooseEmotion('生气',this)"><span class="face">😡</span>生气</button><button class="choice" onclick="chooseEmotion('难过',this)"><span class="face">😢</span>难过</button><button class="choice" onclick="chooseEmotion('委屈',this)"><span class="face">😞</span>委屈</button><button class="choice" onclick="chooseEmotion('不知道',this)"><span class="face">🤔</span>不知道</button></div></section>
<section class="page" id="p5"><div class="title">帮小熊说一说</div><div class="twoCols"><div class="col paper"><div class="colTitle">小熊的感觉</div><div class="optionList"><button class="option" onclick="pickFeeling('生气',this)">生气</button><button class="option" onclick="pickFeeling('难过',this)">难过</button><button class="option" onclick="pickFeeling('有一点委屈',this)">有一点委屈</button></div></div><div class="col paper"><div class="colTitle">为什么呢？</div><div class="optionList"><button class="option" onclick="pickReason('因为我也想玩球',this)">因为我也想玩球</button><button class="option" onclick="pickReason('因为我的想法没有被听见',this)">因为我的想法没有被听见</button><button class="option" onclick="pickReason('因为我觉得不公平',this)">因为我觉得不公平</button></div></div></div><div class="sentence" id="sentence">我感到……，因为……</div><div class="voiceRow"><button class="replay" onclick="speakSentence()">🔊 听一听</button><button class="btn" id="tellBtn" onclick="tellRabbit()" disabled>告诉小兔</button></div></section>
<section class="page" id="p6"><div class="title">小熊说出来了</div><div class="scene" id="scene6"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="char bear" id="b6"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r6"><svg><use href="#rabbit"/></svg></div><div class="dialog" id="d6"></div></div><div class="tap">听听他们怎么说</div><button class="btn" style="align-self:center" onclick="goPage(7)">继续</button></section>
<section class="page" id="p7"><div class="title">重新来一次</div><div class="sub">如果重新来一次，小熊可以怎么做？</div><div class="solutions"><button class="solution" onclick="chooseSolution(0,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="20" y="8" width="100" height="122"/><path d="M126 70L126 111" stroke="#806958" stroke-width="3"/><path d="M114 91L138 91" stroke="#806958" stroke-width="3"/><path d="M153 67L153 106" stroke="#806958" stroke-width="3"/><path d="M144 75L153 66L162 75" fill="none" stroke="#806958" stroke-width="3"/></svg></div><div class="label">停下来</div></button><button class="solution" onclick="chooseSolution(1,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="12" y="7" width="100" height="122"/><path d="M110 61Q143 45 182 62" fill="none" stroke="#806958" stroke-width="3"/><path d="M128 51Q143 39 158 51" fill="none" stroke="#d69b6b" stroke-width="3"/></svg></div><div class="label">说出感觉</div></button><button class="solution" onclick="chooseSolution(2,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="8" y="12" width="92" height="112"/><path d="M118 45Q143 28 168 45" fill="none" stroke="#806958" stroke-width="3"/><circle cx="143" cy="38" r="4" fill="#806958"/><path d="M143 50L143 104" stroke="#806958" stroke-width="3"/></svg></div><div class="label">找老师帮忙</div></button></div><div class="result paper" id="result7"></div><button class="btn hide" id="next7" style="align-self:center" onclick="goPage(8)">继续</button></section>
<section class="page summary"><div class="summary"><svg class="homeFox"><use href="#fox"/></svg><h2>今天，你帮助了小熊。</h2><p>看见感觉<br>说出感觉和原因<br>再一起想办法</p><button class="btn" onclick="location.reload()">再来一次</button></div></section>
</div>
<script>
let feeling='',reason='',storyPlaying=false;
const $=id=>document.getElementById(id);
function goPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p'+n)?.classList.add('active');}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function showDialog(id,text){const el=$(id);el.textContent=text;el.classList.remove('show','talk');void el.offsetWidth;el.classList.add('show');}
function speakAndWait(id,text,who=''){showDialog(id,text);const el=$(id);el.classList.add('talk');let resolved=false;let resolveEnd;const ended=new Promise(r=>resolveEnd=r);const finish=()=>{if(resolved)return;resolved=true;resolveEnd();};try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.88;u.pitch=who==='rabbit'?1.12:who==='bear'?.96:1.05;u.onend=finish;u.onerror=finish;speechSynthesis.speak(u)}catch(e){finish()}return Promise.all([ended,sleep(Math.max(1500,text.length*175))]).then(()=>el.classList.remove('talk'));}
async function startStory(){if(storyPlaying)return;storyPlaying=true;goPage(2);await sleep(450);await playP2();storyPlaying=false;}
async function playP2(){const b=$('b2'),r=$('r2'),ball=$('ball2');b.classList.add('bob');r.classList.add('bob');await sleep(1800);b.classList.remove('bob');r.classList.remove('bob');await sleep(350);b.classList.add('look');r.classList.add('look');await sleep(850);ball.classList.add('ballRoll');await sleep(1250);ball.classList.remove('ballRoll');await sleep(250);await speakAndWait('d2','这个球是我的！','bear');await sleep(220);await speakAndWait('d2','我也要玩！','rabbit');await sleep(350);goPage(3);await playP3();}
async function playP3(){const b=$('b3');await sleep(300);await speakAndWait('d3','给我！','bear');await sleep(220);await speakAndWait('d3','不要，我先看到的！','rabbit');b.classList.add('shake');await sleep(700);b.classList.remove('shake');await sleep(150);await speakAndWait('d3','诶，我不玩了……我不要了，我不玩了。','bear');await sleep(350);b.classList.add('stepLeft');await sleep(1500);b.classList.add('crouchMove');await sleep(600);showCrouched('b3');await sleep(650);goPage(4);}
function showCrouched(id){const b=$(id);b.classList.add('crouched');b.classList.remove('stepLeft','crouchMove');}
async function chooseEmotion(v,btn){if(btn.disabled)return;document.querySelectorAll('#emotionChoices .choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');document.querySelectorAll('#emotionChoices .choice').forEach(x=>x.disabled=true);let t=v==='不知道'?'没关系，我们可以再看看小熊发生了什么。':`你发现小熊可能有一点${v}。`;await speakAndWait('foxQuestion',t,'fox');if(v==='不知道'){document.querySelectorAll('#emotionChoices .choice').forEach(x=>x.disabled=false);return;}await sleep(250);goPage(5);}
function pickFeeling(v,btn){feeling=v;document.querySelectorAll('.col:first-child .option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');updateSentence();}
function pickReason(v,btn){reason=v;document.querySelectorAll('.col:last-child .option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');updateSentence();}
function updateSentence(){const ready=!!(feeling&&reason);$('sentence').textContent=ready?`我感到${feeling}，${reason}。我们可以一起玩吗？`:'我感到……，因为……';$('tellBtn').disabled=!ready;}
function speakSentence(){if(!feeling||!reason)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('sentence').textContent);u.lang='zh-CN';u.rate=.88;speechSynthesis.speak(u);}
async function tellRabbit(){if(!feeling||!reason)return;goPage(6);$('b6').classList.add('reach');await sleep(350);await speakAndWait('d6',$('sentence').textContent,'bear');$('b6').classList.remove('reach');await sleep(300);$('r6').classList.add('reach');await speakAndWait('d6','可以呀！那我们一人站一边传球，好不好？','rabbit');$('r6').classList.remove('reach');await sleep(500);}
async function chooseSolution(i,btn){document.querySelectorAll('.solution').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');const texts=['小熊先停下来，让自己慢一点，再说出自己的感觉。','小熊说：“我感到有一点委屈，因为我也想玩球。”','小熊去找老师：“老师，我和小兔都想玩这个球。”'];$('result7').textContent=texts[i];$('next7').classList.remove('hide');const card=btn.querySelector('svg');card.classList.remove('settle','reach','walkTeacher');void card.offsetWidth;card.classList.add(i===0?'settle':i===1?'reach':'walkTeacher');}
</script>
