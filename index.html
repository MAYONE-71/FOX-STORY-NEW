<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小狐的心情故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6e9;--paper2:#fffaf0;--ink:#5d5148;--soft:#89786d;--fox:#e98945;--scarf:#79a9a2;--bear:#b98661;--rabbit:#fff9ed;--lav:#b79bc8;--sky:#dce9df;--line:#c9a88d;--accent:#e99a5b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e1d4;color:var(--ink)}
body{font-family:"ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi",cursive,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}#app{width:min(1120px,100%);margin:auto;min-height:100svh;background:var(--paper);position:relative;overflow:hidden}
#app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#8d735e .55px,transparent .7px);background-size:7px 7px;mix-blend-mode:multiply}
.page{display:none;min-height:100svh;padding:28px clamp(18px,5vw,66px) 38px;flex-direction:column;gap:12px;position:relative}.page.active{display:flex}
.home{justify-content:center;align-items:center;text-align:center;gap:10px}.home .foxHero{width:220px;height:260px;animation:floaty 3s ease-in-out infinite}.home h1{font-size:48px;font-weight:400;margin:0;color:#604d40;letter-spacing:2px}.home p{font-size:24px;margin:0 0 10px;color:#7e6d61}
.btn{background:#e89a5b;padding:13px 34px;min-height:58px;border-radius:30px;font-size:23px;box-shadow:0 4px 0 #c97846;position:relative}.btn:active{transform:translateY(4px);box-shadow:none}
.title{font-size:34px;text-align:center;font-weight:400;letter-spacing:1px;margin-top:2px}.sub{font-size:20px;text-align:center;color:var(--soft)}
.scene{position:relative;min-height:430px;flex:1;overflow:hidden;border:1.5px solid #d7c6af;border-radius:28px;background:linear-gradient(var(--sky) 0 57%,#dce6bf 57%);box-shadow:0 8px 24px #70584416}.scene:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-16%;height:31%;background:#c5d6a4;border-radius:50% 50% 0 0}
.sun{position:absolute;right:8%;top:8%;width:70px;height:70px;border-radius:50%;background:#f4d18b;box-shadow:0 0 0 8px #f4d18b22}.cloud{position:absolute;left:10%;top:12%;width:110px;height:28px;border-radius:30px;background:#fffaf0aa}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fffaf0aa}.cloud:before{width:48px;height:48px;left:16px;top:-20px}.cloud:after{width:38px;height:38px;left:53px;top:-13px}
.char{position:absolute;z-index:4;transition:transform .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 7px 3px #5d514812)}.char svg{width:100%;height:100%;overflow:visible}.bear{width:180px;height:225px;left:17%;bottom:7%}.rabbit{width:180px;height:225px;right:16%;bottom:7%}.fox{width:135px;height:175px;right:3%;bottom:4%;z-index:8}.ball{position:absolute;width:58px;height:58px;z-index:6;transition:all .8s cubic-bezier(.2,.8,.2,1)}
.dialog{position:absolute;z-index:20;left:50%;top:18px;transform:translateX(-50%);max-width:82%;min-width:250px;padding:11px 20px;background:#fffaf0e8;border:1.5px solid #d8bda2;border-radius:24px;text-align:center;font-size:22px;line-height:1.35;box-shadow:0 4px 14px #5d514812;opacity:0;transition:.25s}.dialog.show{opacity:1}.tap{font-size:17px;color:#8a786b;text-align:center}
.paperCard{background:#fffaf0cc;border:1.5px solid #dbc7ae;border-radius:24px;box-shadow:0 5px 15px #66513f0e}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choice{min-height:110px;padding:12px;background:transparent;border-radius:22px;position:relative;font-size:24px}.choice:after{content:"";position:absolute;inset:2px;border:1.5px dashed #d9bca0;border-radius:20px;pointer-events:none}.choice.selected{background:#fff0dc}.choice .face{font-size:38px;display:block;margin-bottom:3px}
.storyFox{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:3px}.storyFox .foxMini{width:82px;height:105px;flex:none}.speech{max-width:720px;padding:12px 18px;font-size:22px;line-height:1.4;background:#fffaf0d9;border:1.5px dashed #c8a88e;border-radius:24px}.build{display:grid;grid-template-columns:1fr 1fr;gap:12px}.build button{min-height:92px;background:#fffaf0d9;border:1.5px dashed #cfb296;border-radius:22px;font-size:22px;padding:12px}.build button.selected{background:#fff0dc;border-style:solid;border-color:#e6a06b}.sentence{font-size:29px;text-align:center;line-height:1.55;background:#fff0dc;border:1.5px solid #e1b68f;border-radius:25px;padding:16px 22px;min-height:92px}.voiceRow{display:flex;justify-content:center;gap:10px;align-items:center}.replay{background:#fffaf0;border:1.5px solid #d8bda2;border-radius:22px;padding:8px 15px;font-size:18px}
.solutions{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.solution{background:#fffaf0;border:1.5px dashed #cfb296;border-radius:24px;overflow:hidden;transition:.2s}.solution.selected{border-style:solid;border-color:#e59b63;background:#fff0dc;transform:translateY(-3px)}.solution .pic{height:190px;background:#e7eee0;display:flex;align-items:center;justify-content:center}.solution .label{padding:10px;text-align:center;font-size:22px}.solution svg{width:94%;height:94%}.result{font-size:22px;line-height:1.5;text-align:center;padding:13px 18px}.summary{align-items:center;justify-content:center;text-align:center}.summary h2{font-size:38px;font-weight:400;margin:0}.summary p{font-size:24px;line-height:1.6;margin:6px 0 18px}.hide{display:none!important}
.outline{stroke:#725b4d;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.sketch{stroke:#8b6c59;stroke-width:1.1;fill:none;opacity:.38;stroke-linecap:round}.thin{stroke:#725b4d;stroke-width:1.7;fill:none;stroke-linecap:round}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-12px)}100%{transform:translateY(0)}}@keyframes roll{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(250px,-3px) rotate(700deg)}}@keyframes walkCorner{0%{transform:translate(0,0)}60%{transform:translate(-90px,12px) scale(.96)}100%{transform:translate(-118px,28px) scale(.88)}}@keyframes crouch{0%{transform:translate(-118px,28px) scale(.88)}100%{transform:translate(-118px,48px) scale(.78) rotate(-1deg)}}@keyframes pop{0%{transform:scale(.96);opacity:.2}100%{transform:scale(1);opacity:1}}.speaking{animation:pop .25s ease}.hop{animation:hop .7s ease}.roll{animation:roll 1.1s cubic-bezier(.2,.75,.25,1) forwards}.walkCorner{animation:walkCorner 1.2s cubic-bezier(.2,.75,.25,1) forwards}.crouch{animation:crouch .45s ease forwards}
@media(max-width:720px){.page{padding:18px 13px 32px}.title{font-size:30px}.sub{font-size:18px}.scene{min-height:405px}.bear,.rabbit{width:145px;height:185px}.bear{left:3%}.rabbit{right:3%}.fox{width:100px;height:135px}.choices{grid-template-columns:1fr 1fr}.build{grid-template-columns:1fr}.solutions{grid-template-columns:1fr}.solution .pic{height:155px}.home h1{font-size:39px}.home p{font-size:21px}.dialog{font-size:19px}.sentence{font-size:23px}}
</style></head><body><div id="app">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="fox" viewBox="0 0 180 220"><path d="M47 75L35 27L69 48Q90 39 111 48L145 27L133 75Q141 93 136 110Q128 137 90 141Q52 137 44 110Q39 93 47 75Z" fill="#e98945" class="outline"/><path d="M50 112Q90 96 130 112Q124 139 90 145Q56 139 50 112Z" fill="#fff8ec"/><path d="M40 33L58 54M141 33L122 54" class="sketch"/><ellipse cx="67" cy="88" rx="5.5" ry="7" fill="#594b44"/><ellipse cx="113" cy="88" rx="5.5" ry="7" fill="#594b44"/><circle cx="65" cy="85" r="1.8" fill="#fff"/><circle cx="111" cy="85" r="1.8" fill="#fff"/><path d="M84 101Q90 96 96 101Q90 108 84 101Z" fill="#594b44"/><path d="M82 114Q90 120 98 114" class="thin"/><path d="M61 140Q51 159 56 193Q73 204 90 198Q107 204 124 193Q129 159 119 140" fill="#e98945" class="outline"/><path d="M67 147Q90 139 113 147L112 187Q90 195 68 187Z" fill="#79a9a2" opacity=".95"/><path d="M64 151Q43 163 37 183M116 151Q137 163 143 183" class="thin"/><path d="M74 194L68 211M106 194L112 211" class="thin"/></symbol>
<symbol id="bear" viewBox="0 0 180 220"><circle cx="53" cy="53" r="22" fill="#b98661" class="outline"/><circle cx="127" cy="53" r="22" fill="#b98661" class="outline"/><ellipse cx="90" cy="94" rx="47" ry="49" fill="#b98661" class="outline"/><ellipse cx="90" cy="113" rx="24" ry="17" fill="#e8cfb5"/><ellipse cx="72" cy="89" rx="5.3" ry="6.7" fill="#594b44"/><ellipse cx="108" cy="89" rx="5.3" ry="6.7" fill="#594b44"/><circle cx="70.5" cy="86.5" r="1.8" fill="#fff"/><circle cx="106.5" cy="86.5" r="1.8" fill="#fff"/><ellipse cx="90" cy="105" rx="6.5" ry="4.7" fill="#594b44"/><path d="M81 117Q90 124 99 117" class="thin"/><ellipse cx="90" cy="169" rx="54" ry="53" fill="#b98661" class="outline"/><path d="M49 156Q27 169 22 191M131 156Q153 169 158 191" class="thin"/><path d="M70 207L66 219M110 207L114 219" class="thin"/></symbol>
<symbol id="rabbit" viewBox="0 0 180 220"><path d="M61 70Q36 15 56 17Q74 21 78 69M119 70Q144 15 124 17Q106 21 102 69" fill="#fff8ec" class="outline"/><path d="M61 39Q54 30 57 53M119 39Q126 30 123 53" stroke="#e7aeb8" stroke-width="5" fill="none"/><ellipse cx="90" cy="95" rx="45" ry="50" fill="#fff8ec" class="outline"/><ellipse cx="90" cy="177" rx="51" ry="49" fill="#fff8ec" class="outline"/><circle cx="73" cy="91" r="5.3" fill="#594b44"/><circle cx="107" cy="91" r="5.3" fill="#594b44"/><circle cx="71.5" cy="88.5" r="1.8" fill="#fff"/><circle cx="105.5" cy="88.5" r="1.8" fill="#fff"/><path d="M84 106Q90 101 96 106Q90 113 84 106Z" fill="#594b44"/><path d="M82 119Q90 125 98 119" class="thin"/><path d="M56 156Q34 171 28 193M124 156Q146 171 152 193" class="thin"/><path d="M71 211L67 220M109 211L113 220" class="thin"/><path d="M63 150Q90 142 117 150L113 188Q90 194 67 188Z" fill="#b79bc8" opacity=".9"/></symbol>
</defs></svg>
<section class="page home active" id="p1"><svg class="foxHero"><use href="#fox"/></svg><h1>小狐的心情故事</h1><p>你好，我是小狐</p><button class="btn" onclick="start()">开始故事</button></section>
<section class="page" id="p2"><div class="title">一起玩吧</div><div class="sub">下午，幼儿园的操场上</div><div class="scene" id="scene2"><div class="sun"></div><div class="cloud"></div><div class="dialog" id="d2"></div><div class="char bear" id="b2"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r2"><svg><use href="#rabbit"/></svg></div><div class="ball" id="ball2" style="left:45%;bottom:32%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fffaf0" class="outline"/><path d="M24 20L35 15L46 22L42 34L29 34Z" fill="#79a9a2"/><path d="M24 20L14 30M46 22L55 32M29 34L22 49M42 34L49 49" class="thin"/></svg></div></div><div class="tap">故事会自己往下走，小狐会在需要的时候来帮忙。</div><button class="btn hide" id="n2" onclick="go(3)">继续</button></section>
<section class="page" id="p3"><div class="title">小熊怎么了？</div><div class="scene" id="scene3"><div class="sun"></div><div class="cloud"></div><div class="dialog" id="d3"></div><div class="char bear" id="b3"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r3"><svg><use href="#rabbit"/></svg></div><div class="char fox" id="f3"><svg><use href="#fox"/></svg></div><div class="ball" style="left:49%;bottom:31%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fffaf0" class="outline"/><path d="M24 20L35 15L46 22L42 34L29 34Z" fill="#79a9a2"/><path d="M24 20L14 30M46 22L55 32M29 34L22 49M42 34L49 49" class="thin"/></svg></div></div><div class="storyFox"><svg class="foxMini"><use href="#fox"/></svg><div class="speech" id="fox3">你发现了吗？小熊好像和刚才不一样了。</div></div><div class="choices"><button class="choice" onclick="chooseEmotion('生气',this)"><span class="face">😠</span>生气</button><button class="choice" onclick="chooseEmotion('难过',this)"><span class="face">😢</span>难过</button><button class="choice" onclick="chooseEmotion('委屈',this)"><span class="face">🥺</span>委屈</button><button class="choice" onclick="chooseEmotion('不知道',this)"><span class="face">🤔</span>不知道</button></div><button class="btn hide" id="n3" onclick="go(4)">继续</button></section>
<section class="page" id="p4"><div class="title">帮小熊说一说</div><div class="storyFox"><svg class="foxMini"><use href="#fox"/></svg><div class="speech" id="fox4">我们把小熊的感觉说出来，再告诉小兔想要什么。</div></div><div class="sub">把小熊的感觉说出来</div><div class="paperCard" style="padding:14px"><div class="sentence" id="sentence">我感到有一点……</div><div class="voiceRow"><button class="replay" onclick="speakSentence()">🔊 听一听</button></div></div><div class="build"><button onclick="pickFeeling('生气',this)">有一点生气</button><button onclick="pickFeeling('难过',this)">有一点难过</button><button onclick="pickFeeling('委屈',this)">有一点委屈</button><button onclick="pickReason('因为我也想玩球',this)">因为我也想玩球</button><button onclick="pickReason('因为我的想法没有被听见',this)">因为我的想法没有被听见</button><button onclick="pickReason('因为我觉得不公平',this)">因为我觉得不公平</button></div><button class="btn hide" id="tellBtn" onclick="tellRabbit()">告诉小兔</button></section>
<section class="page" id="p5"><div class="title">如果重新来一次</div><div class="sub">小熊还是很生气，这一次可以怎么做？</div><div class="scene" id="scene5"><div class="sun"></div><div class="cloud"></div><div class="dialog" id="d5"></div><div class="char bear" id="b5"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r5"><svg><use href="#rabbit"/></svg></div><div class="char fox" id="f5"><svg><use href="#fox"/></svg></div></div><div class="solutions"><button class="solution" onclick="chooseSolution('停下来',this)"><div class="pic"><svg viewBox="0 0 240 160"><use href="#bear" x="30" y="-5" width="110" height="135"/><path d="M155 118Q177 95 197 118" class="thin"/><path d="M177 58v30M162 73h30" stroke="#d69b67" stroke-width="4" stroke-linecap="round"/></svg></div><div class="label">先停下来</div></button><button class="solution" onclick="chooseSolution('说出来',this)"><div class="pic"><svg viewBox="0 0 240 160"><use href="#bear" x="15" y="-5" width="105" height="130"/><path d="M120 48Q160 22 205 50L195 84Q158 96 126 79Z" fill="#fffaf0" stroke="#c9a88d" stroke-width="2"/><circle cx="151" cy="60" r="3" fill="#c9a88d"/><circle cx="164" cy="60" r="3" fill="#c9a88d"/><circle cx="177" cy="60" r="3" fill="#c9a88d"/></svg></div><div class="label">把感觉说出来</div></button><button class="solution" onclick="chooseSolution('找老师',this)"><div class="pic"><svg viewBox="0 0 240 160"><use href="#bear" x="5" y="0" width="95" height="120"/><use href="#rabbit" x="135" y="5" width="90" height="115"/><path d="M93 57Q119 36 143 56" class="thin"/><path d="M116 41v34M101 57h30" stroke="#d69b67" stroke-width="4" stroke-linecap="round"/></svg></div><div class="label">找老师帮忙</div></button></div><div class="result paperCard hide" id="result5"></div><button class="btn hide" id="n5" onclick="go(6)">继续</button></section>
<section class="page" id="p6"><div class="title">这一次，小熊这样说</div><div class="scene" id="scene6"><div class="sun"></div><div class="cloud"></div><div class="dialog" id="d6"></div><div class="char bear" id="b6"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r6"><svg><use href="#rabbit"/></svg></div><div class="char fox" id="f6"><svg><use href="#fox"/></svg></div><div class="ball" id="ball6" style="left:49%;bottom:30%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fffaf0" class="outline"/><path d="M24 20L35 15L46 22L42 34L29 34Z" fill="#79a9a2"/><path d="M24 20L14 30M46 22L55 32M29 34L22 49M42 34L49 49" class="thin"/></svg></div></div><div class="result paperCard" id="result6"></div><button class="btn hide" id="n6" onclick="go(7)">继续</button></section>
<section class="page summary" id="p7"><svg class="foxHero" style="width:170px;height:205px"><use href="#fox"/></svg><h2>今天，小熊学会了</h2><p>先看看自己的感觉，<br>再把感觉和想法说出来，<br>然后一起找办法。</p><button class="btn" onclick="location.reload()">再玩一次</button></section>
</div>
<script>
let page=1,emotion='',feeling='',reason='',solution='';const $=id=>document.getElementById(id);
function go(n){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('p'+n).classList.add('active');page=n;runPage(n)}
function speak(text,el){if(el){el.textContent=text;el.classList.remove('show','speaking');void el.offsetWidth;el.classList.add('show','speaking')}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.9;u.pitch=1.05;speechSynthesis.speak(u)}}
function start(){go(2)}
function runPage(n){
 if(n===2){$('b2').classList.remove('hop');$('r2').classList.remove('hop');$('ball2').classList.remove('roll');$('n2').classList.add('hide');setTimeout(()=>speak('小熊和小兔正在一起玩。','d2'),600);setTimeout(()=>speak('咦？一个球滚过来了！','d2'),2600);setTimeout(()=>{$('ball2').classList.add('roll');$('b2').classList.add('hop');$('r2').classList.add('hop')},3700);setTimeout(()=>speak('这个球是我的！','d2'),5000);setTimeout(()=>speak('不，是我先看到的！','d2'),6500);setTimeout(()=>$('n2').classList.remove('hide'),7900)}
 else if(n===3){$('b3').className='char bear';setTimeout(()=>speak('我也要玩！','d3'),500);setTimeout(()=>speak('不给你！','d3'),1800);setTimeout(()=>speak('哼！我不玩了！','d3'),3000);setTimeout(()=>$('b3').classList.add('walkCorner'),3900);setTimeout(()=>$('b3').classList.add('crouch'),5200);setTimeout(()=>speak('你发现了吗？小熊好像和刚才不一样了。','fox3'),6000)}
 else if(n===4){const f=feeling||emotion||'难过';$('sentence').textContent='我感到有一点'+f+'。';$('tellBtn').classList.add('hide');setTimeout(()=>speak('我们把小熊的感觉说出来，再告诉小兔想要什么。','fox4'),500)}
 else if(n===5){$('b5').className='char bear';$('result5').classList.add('hide');$('n5').classList.add('hide');setTimeout(()=>speak('小熊还是很生气……','d5'),700);setTimeout(()=>speak('如果重新来一次，你会怎么做？','d5'),2200)}
 else if(n===6){$('result6').textContent='';$('n6').classList.add('hide');setTimeout(()=>speak('我感到有一点'+(feeling||'难过')+'，因为我也想玩球。我们可以一起玩吗？','d6'),700);setTimeout(()=>speak('可以呀！那我们一人站一边传球，好不好？','d6'),4300);setTimeout(()=>{$('ball6').classList.add('hop');$('b6').classList.add('hop');$('r6').classList.add('hop')},6100);setTimeout(()=>{$('result6').textContent='听见彼此的感觉以后，他们找到了新的玩法。'},7200);setTimeout(()=>$('n6').classList.remove('hide'),7900)}
}
function chooseEmotion(v,el){emotion=v;document.querySelectorAll('#p3 .choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');let t=v==='不知道'?'没关系，我们还可以继续看看发生了什么。':'你发现小熊可能有一点'+v+'。';speak(t,'fox3');$('n3').classList.remove('hide')}
function pickFeeling(v,el){feeling=v;document.querySelectorAll('#p4 .build button').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');updateSentence()}
function pickReason(v,el){reason=v;document.querySelectorAll('#p4 .build button').forEach(x=>{if(x.textContent.startsWith('因为'))x.classList.remove('selected')});el.classList.add('selected');updateSentence()}
function updateSentence(){if(!feeling)feeling=emotion&&emotion!=='不知道'?emotion:'难过';let s='我感到有一点'+feeling;if(reason)s+='，'+reason;else s+='。';$('sentence').textContent=s;if(feeling&&reason)$('tellBtn').classList.remove('hide')}
function speakSentence(){let s=$('sentence').textContent;if(s!=='我感到有一点……')speak(s)}
function tellRabbit(){go(5)}
function chooseSolution(v,el){solution=v;document.querySelectorAll('.solution').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');let t='';if(v==='停下来')t='先停一停，让身体慢下来，再想办法。';if(v==='说出来')t='把感觉说出来，也告诉朋友自己想要什么。';if(v==='找老师')t='自己想不到办法时，可以请老师帮忙。';$('result5').textContent=t;$('result5').classList.remove('hide');speak(t,'d5');$('n5').classList.remove('hide')}
</script></body></html>
