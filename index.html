<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小狐的心情故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf5e9;--paper2:#fffaf1;--ink:#65564d;--muted:#927f72;--line:#7b675a;--sky:#e9eee4;--grass:#d4dbb1;--orange:#df9360;--bear:#b99272;--bearLight:#d8b99c;--rabbit:#f5eee1;--pink:#d7a9ad;--teal:#83aaa1;--yellow:#ead39b;--cream:#fff5e6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8dfd3;color:var(--ink)}body{font-family:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",cursive,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{width:min(1160px,100%);min-height:100svh;margin:auto;background:var(--paper);position:relative;overflow:hidden}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:99;opacity:.22;background-image:radial-gradient(#8d7566 .55px,transparent .8px);background-size:8px 8px;mix-blend-mode:multiply}
.page{display:none;min-height:100svh;padding:24px clamp(16px,5vw,70px) 32px;gap:13px;position:relative}.page.active{display:flex;flex-direction:column}
.home{align-items:center;justify-content:center;text-align:center;gap:8px}.home h1{font-size:50px;font-weight:400;margin:0}.home p{font-size:25px;margin:0 0 12px;color:var(--muted)}.homeFox{width:220px;height:260px;animation:float 3.2s ease-in-out infinite}
.title{text-align:center;font-size:36px;font-weight:400;line-height:1.1}.sub{text-align:center;color:var(--muted);font-size:20px;margin-top:-3px}
.btn{background:var(--orange);color:#fff;padding:10px 31px;min-height:53px;border-radius:25px 22px 26px 21px;font-size:23px;box-shadow:0 4px 0 #c27c51}.btn:active{transform:translateY(3px);box-shadow:none}
.scene{position:relative;min-height:430px;flex:1;overflow:hidden;border:2px solid #bda890;border-radius:30px 24px 28px 25px;background:var(--sky)}
.scene:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.42;background:repeating-linear-gradient(169deg,transparent 0 24px,#a58d7a18 25px 26px),repeating-linear-gradient(12deg,transparent 0 39px,#fffdf61c 40px 41px)}
.ground{position:absolute;left:-8%;right:-8%;bottom:-19%;height:43%;background:var(--grass);border-radius:55% 55% 0 0}.sun{position:absolute;right:8%;top:9%;width:64px;height:64px;border-radius:47% 53% 51% 49%;background:var(--yellow)}
.cloud{position:absolute;left:10%;top:13%;width:100px;height:25px;border-radius:40px;background:#fffaf0a8}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fffaf0a8}.cloud:before{width:42px;height:42px;left:13px;top:-17px}.cloud:after{width:32px;height:32px;left:55px;top:-10px}
.char{position:absolute;z-index:5;filter:drop-shadow(0 5px 2px #6b554514)}.char svg{width:100%;height:100%;overflow:visible}.bear{width:205px;height:245px;left:14%;bottom:5%}.rabbit{width:205px;height:245px;right:13%;bottom:5%}.fox{width:145px;height:180px;right:3%;bottom:3%;z-index:8}
.dialog{position:absolute;z-index:20;left:50%;top:16px;transform:translateX(-50%);max-width:84%;min-width:210px;padding:10px 20px;background:#fffaf0ee;border:2px solid #b99b80;border-radius:28px 23px 25px 21px;text-align:center;font-size:25px;line-height:1.42;opacity:0}.dialog.show{opacity:1;animation:pop .22s ease}.dialog:after{content:"";position:absolute;left:48%;bottom:-11px;width:17px;height:17px;background:#fffaf0ee;border-right:2px solid #b99b80;border-bottom:2px solid #b99b80;transform:rotate(45deg)}
.storyFox{display:flex;justify-content:center;align-items:center;gap:10px}.storyFox svg{width:72px;height:92px;flex:none}.speech{padding:9px 17px;font-size:22px;line-height:1.42;max-width:760px;background:#fffaf0d9;border:2px solid #b99b80;border-radius:25px 20px 24px 19px}.paper{background:#fffaf0d9;border:2px solid #b99b80;border-radius:25px 20px 24px 19px}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.choice{min-height:96px;padding:10px;background:#fffaf0c7;border:2px solid #c8ae95;border-radius:22px 18px 24px 20px;font-size:22px}.choice.selected{background:#fff0dc;border-color:#db925d}.face{font-size:32px;display:block}
.twoCols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col{padding:13px}.colTitle{text-align:center;font-size:27px;margin-bottom:8px}.optionList{display:grid;gap:9px}.option{min-height:63px;padding:8px 12px;background:#fffaf0bd;border:2px dashed #c8ae95;border-radius:18px 22px 17px 20px;font-size:21px}.option.selected{background:#fff0dc;border-style:solid;border-color:#db925d}.sentence{padding:13px 18px;text-align:center;font-size:28px;line-height:1.5;background:#fff0dc;border:2px solid #d9ad87;border-radius:25px 20px 24px 18px;min-height:67px}.voiceRow{text-align:center;display:flex;gap:10px;justify-content:center}.replay{background:#fffaf0;border:2px solid #c5aa90;border-radius:20px;padding:7px 14px;font-size:18px}
.solutions{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.solution{background:#fffaf0;border:2px dashed #c5aa90;border-radius:24px 19px 23px 20px;overflow:hidden;padding:0}.solution.selected{border-style:solid;border-color:#db925d;background:#fff0dc}.solution .pic{height:205px;background:#e8edde;display:flex;align-items:center;justify-content:center}.solution svg{width:96%;height:96%}.solution .label{text-align:center;padding:8px;font-size:23px}.result{text-align:center;font-size:22px;line-height:1.5;padding:11px 17px}.hide{display:none!important}.tap{text-align:center;color:var(--muted);font-size:19px}.summary{align-items:center;justify-content:center;text-align:center}.summary h2{font-size:40px;font-weight:400;margin:0}.summary p{font-size:25px;line-height:1.6}
/* 让人物更像手绘涂鸦：轮廓不完全规则、填色带轻微铅笔痕 */
.outline{stroke:var(--line);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.pencil{stroke:#876f60;stroke-width:1.25;fill:none;opacity:.48;stroke-linecap:round;stroke-linejoin:round}.pencil2{stroke:#a18872;stroke-width:.9;fill:none;opacity:.34;stroke-linecap:round}.thin{stroke:#7d6859;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.rough{stroke:#806959;stroke-width:1.1;fill:none;opacity:.35;stroke-linecap:round}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pop{from{opacity:.1;transform:translateX(-50%) scale(.96)}to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes roll{from{transform:translateX(0) rotate(0)}to{transform:translateX(245px) rotate(720deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(170px) scale(.86)}}@keyframes crouch{0%{transform:translate(0,0)}100%{transform:translate(30px,75px) scale(.82)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}.talk{animation:talk .52s ease-in-out infinite}.blink{transform-origin:center;animation:blink 4.2s infinite}.ballroll{animation:roll 1.25s cubic-bezier(.2,.75,.25,1) forwards}.walk{animation:walk 1.2s ease-in-out forwards}.crouch{animation:crouch 1s ease-in-out forwards}.shake{animation:shake .42s ease-in-out}.nod{animation:nod .8s ease-in-out}
@media(max-width:720px){.page{padding:17px 12px 27px}.title{font-size:31px}.sub{font-size:18px}.scene{min-height:400px}.bear,.rabbit{width:150px;height:185px}.bear{left:1%}.rabbit{right:1%}.fox{width:104px;height:140px}.choices{grid-template-columns:1fr 1fr}.twoCols,.solutions{grid-template-columns:1fr}.solution .pic{height:155px}.home h1{font-size:39px}.sentence{font-size:23px}.dialog{font-size:20px}.storyFox svg{width:58px;height:80px}}
</style>
</head>

<section class="page home active" id="p1">
<svg class="homeFox"><use href="#fox"/></svg><h1>小狐的心情故事</h1><p>你好，我是小狐</p><button class="btn" onclick="startStory()">开始故事</button>
</section>

<section class="page" id="p2">
<div class="title">一起玩吧</div><div class="sub">下午，幼儿园里</div>
<div class="scene" id="scene2"><div class="sun"></div><div class="cloud"></div><div class="ground"></div>
<div class="char bear" id="b2"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r2"><svg><use href="#rabbit"/></svg></div>
<div id="ball2" style="position:absolute;left:27%;bottom:28%;width:58px;height:58px;z-index:7"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fff2df" stroke="#8b6b58" stroke-width="2.5"/><path d="M13 30Q34 19 55 30M20 49Q34 39 48 49M28 8Q34 20 40 8" fill="none" stroke="#d69b6b" stroke-width="2"/></svg></div>
<div class="dialog" id="d2"></div></div>
</section>

<section class="page" id="p3">
<div class="title">发生了什么？</div>
<div class="scene" id="scene3"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="dialog" id="d3"></div>
<div class="char bear" id="b3"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r3"><svg><use href="#rabbit"/></svg></div>
<div style="position:absolute;left:44%;bottom:30%;width:58px;height:58px"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fff2df" stroke="#8b6b58" stroke-width="2.5"/><path d="M13 30Q34 19 55 30M20 49Q34 39 48 49" fill="none" stroke="#d69b6b" stroke-width="2"/></svg></div></div>
</section>

<section class="page" id="p4">
<div class="title">小熊怎么了？</div>
<div class="scene"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="char bear" id="b4"><svg><use href="#bearCrouch"/></svg></div><div class="char rabbit" id="r4"><svg><use href="#rabbit"/></svg></div></div>
<div class="storyFox"><svg><use href="#fox"/></svg><div class="speech paper" id="foxQuestion">你发现了吗？<br>小熊好像不一样了。</div></div>
<div class="choices" id="emotionChoices"><button class="choice" onclick="chooseEmotion('生气',this)"><span class="face">😡</span>生气</button><button class="choice" onclick="chooseEmotion('难过',this)"><span class="face">😢</span>难过</button><button class="choice" onclick="chooseEmotion('委屈',this)"><span class="face">😞</span>委屈</button><button class="choice" onclick="chooseEmotion('不知道',this)"><span class="face">🤔</span>不知道</button></div>
</section>

<section class="page" id="p5">
<div class="title">帮小熊说一说</div><div class="sub">选一选，小熊可以怎么说</div>
<div class="twoCols"><div class="col paper"><div class="colTitle">小熊的感觉</div><div class="optionList"><button class="option" onclick="pickFeeling('生气',this)">生气</button><button class="option" onclick="pickFeeling('难过',this)">难过</button><button class="option" onclick="pickFeeling('有一点委屈',this)">有一点委屈</button></div></div>
<div class="col paper"><div class="colTitle">为什么呢？</div><div class="optionList"><button class="option" onclick="pickReason('因为我也想玩球',this)">因为我也想玩球</button><button class="option" onclick="pickReason('因为我的想法没有被听见',this)">因为我的想法没有被听见</button><button class="option" onclick="pickReason('因为我觉得不公平',this)">因为我觉得不公平</button></div></div></div>
<div class="sentence" id="sentence">我感到……，因为……</div><div class="voiceRow"><button class="replay" onclick="speakSentence()">🔊 听一听</button><button class="btn" onclick="tellRabbit()">告诉小兔</button></div>
</section>

<section class="page" id="p6">
<div class="title">小熊说出来了</div>
<div class="scene"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="char bear" id="b6"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r6"><svg><use href="#rabbit"/></svg></div><div class="dialog" id="d6"></div></div>
<button class="btn" style="align-self:center" onclick="goPage(7)">继续</button>
</section>

<section class="page" id="p7">
<div class="title">重新来一次</div><div class="sub">如果重新来一次，小熊可以怎么做？</div>
<div class="solutions">
<button class="solution" onclick="chooseSolution(0,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="22" y="0" width="100" height="122"/><path d="M125 104Q145 94 168 104" class="pencil"/><path d="M148 72L148 103" class="thin"/></svg></div><div class="label">停下来</div></button>
<button class="solution" onclick="chooseSolution(1,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="13" y="2" width="100" height="122"/><path d="M104 67Q139 51 184 68" class="thin"/><path d="M132 58Q143 44 156 57" class="pencil"/></svg></div><div class="label">说出感觉</div></button>
<button class="solution" onclick="chooseSolution(2,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="8" y="17" width="92" height="112"/><path d="M120 40Q143 22 168 40" class="thin"/><path d="M147 42L147 103" class="thin"/><circle cx="147" cy="31" r="4" fill="#806958"/></svg></div><div class="label">找老师帮忙</div></button>
</div><div class="result paper" id="result7"></div><button class="btn hide" id="next7" style="align-self:center" onclick="goPage(8)">继续</button>
</section>

<section class="page summary"><div class="summary"><svg class="homeFox"><use href="#fox"/></svg><h2>今天，你帮助了小熊。</h2><p>看见感觉<br>说出感觉和原因<br>再一起想办法</p><button class="btn" onclick="location.reload()">再来一次</button></div></section>
</div>

<script>
const state={page:1,feeling:'',reason:'',emotion:''};
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices()||[]}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function pickVoice(kind){
 const zh=voices.filter(v=>/^zh/i.test(v.lang)||/Chinese|Mandarin|普通话|中文|Xiaoxiao|Yunxi|Yaoyao|Huihui|Ting-Ting/i.test(v.name));
 const all=zh.length?zh:voices;
 if(!all.length)return null;
 const keys=kind==='fox'?/Xiaoxiao|Yaoyao|Ting-Ting|Mei-Jia|女|Female/i:kind==='bear'?/Yunxi|Kangkang|男|Male|Li-Mu/i:/Huihui|Ting-Ting|女|Female/i;
 return all.find(v=>keys.test(v.name))||all[{fox:0,bear:Math.min(1,all.length-1),rabbit:Math.min(2,all.length-1)}[kind]];
}
function speak(text,kind='fox',opts={}){
 if(!('speechSynthesis'in window)||!text)return;
 stopVoice();
 const parts=text.match(/[^。！？!?，,]+[。！？!?]?/g)||[text];
 let i=0;
 const next=()=>{if(i>=parts.length)return;const u=new SpeechSynthesisUtterance(parts[i++]);u.lang='zh-CN';const v=pickVoice(kind);if(v)u.voice=v;u.rate=opts.rate??({fox:.96,bear:.82,rabbit:1.04}[kind]);u.pitch=opts.pitch??({fox:1.28,bear:.78,rabbit:1.12}[kind]);u.volume=1;u.onend=()=>setTimeout(next,opts.pause??130);speechSynthesis.speak(u)};next();
}
function showDialog(id,text,kind='fox',opts={}){const el=document.getElementById(id);el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');speak(text,kind,opts)}
function goPage(n){stopVoice();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const el=document.getElementById('p'+n)||document.querySelector('.summary');el.classList.add('active');state.page=n;setTimeout(()=>pageIntro(n),180)}
function startStory(){goPage(2)}
function pageIntro(n){
 if(n===2)playPage2();
 if(n===3)playPage3();
 if(n===4)speak('你发现了吗？小熊好像和刚才不一样了。你觉得小熊怎么了？','fox');
 if(n===6){const b=document.getElementById('b6');b.classList.add('talk');setTimeout(()=>showDialog('d6',fullSentence(),'bear',{rate:.78,pitch:.74,pause:150}),250);setTimeout(()=>showDialog('d6','可以呀！那我们一人站一边传球，好不好？','rabbit',{rate:1.03,pitch:1.08,pause:160}),fullSentence().length*48+900)}
}
function playPage2(){
 const b=document.getElementById('b2'),r=document.getElementById('r2'),ball=document.getElementById('ball2');b.className='char bear';r.className='char rabbit';ball.className='';
 setTimeout(()=>showDialog('d2','这个球是我的！','bear',{rate:.82,pitch:.76}),900);
 setTimeout(()=>showDialog('d2','我也要玩！','rabbit',{rate:1.05,pitch:1.12}),2500);
 setTimeout(()=>{ball.classList.add('ballroll');speak('','fox')},3900);
 setTimeout(()=>goPage(3),5400);
}
function playPage3(){
 const b=document.getElementById('b3'),r=document.getElementById('r3');b.className='char bear';r.className='char rabbit';
 setTimeout(()=>showDialog('d3','给我！','bear',{rate:.82,pitch:.72}),500);
 setTimeout(()=>showDialog('d3','不要，我先看到的！','rabbit',{rate:1.04,pitch:1.08}),1750);
 setTimeout(()=>showDialog('d3','诶，我不玩了……我不要了，我不玩了。','bear',{rate:.78,pitch:.74,pause:180}),3350);
 setTimeout(()=>{b.classList.add('walk');},5650);
 setTimeout(()=>{b.classList.remove('walk');b.classList.add('crouch');},6900);
 setTimeout(()=>goPage(4),8000);
}
function chooseEmotion(v,btn){
 document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');state.emotion=v;
 let t=v==='不知道'?'没关系，我们可以再看看小熊发生了什么。':`你发现小熊可能有一点${v}。`;
 speak(t,'fox');
 setTimeout(()=>goPage(5),1250);
}
function pickFeeling(v,btn){document.querySelectorAll('.col:first-child .option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');state.feeling=v;updateSentence()}
function pickReason(v,btn){document.querySelectorAll('.col:last-child .option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');state.reason=v;updateSentence()}
function fullSentence(){return `我感到${state.feeling||'有一点委屈'}，${state.reason||'因为我也想玩球'}。我们可以一起玩吗？`}
function updateSentence(){document.getElementById('sentence').textContent=state.feeling&&state.reason?fullSentence():`我感到${state.feeling||'……'}，${state.reason||'因为……'}`}
function speakSentence(){if(!state.feeling||!state.reason){speak('先选一选小熊的感觉和原因吧。','fox');return}speak(fullSentence(),'bear',{rate:.79,pitch:.74,pause:160})}
function tellRabbit(){if(!state.feeling||!state.reason){speak('先帮小熊选一选吧。','fox');return}goPage(6)}
function chooseSolution(i,btn){
 document.querySelectorAll('.solution').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');
 const result=document.getElementById('result7');
 const texts=[
 '小熊先停下来，等自己慢慢平静一点。',
 '小熊说出自己的感觉，也告诉小兔自己想要什么。',
 '小熊去找老师，把刚才发生的事情说出来。'
 ];
 result.textContent=texts[i];result.classList.remove('hide');document.getElementById('next7').classList.remove('hide');
 speak(texts[i],'fox');
}
</script>
</body>
</html>
