<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小狐的心情故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf4e7;--paper2:#fffaf0;--ink:#5c5149;--soft:#8b796c;--orange:#e88945;--scarf:#73a39d;--bear:#b78460;--rabbit:#fff8ed;--lav:#b69ac6;--green:#c9d7a9;--blue:#dce8df;--line:#c9ad92}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8dfd1;color:var(--ink)}body{font-family:"Ma Shan Zheng","ZCOOL KuaiLe","Kaiti SC","STKaiti",cursive,sans-serif}
#app{width:min(1120px,100%);margin:auto;min-height:100svh;background:var(--paper);position:relative;overflow:hidden}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#8e735c .5px,transparent .7px);background-size:6px 6px;mix-blend-mode:multiply}
.page{display:none;min-height:100svh;padding:26px clamp(18px,5vw,66px) 34px;flex-direction:column;gap:12px;position:relative}.page.active{display:flex}
.home{align-items:center;justify-content:center;text-align:center;gap:9px}.home h1{font-size:48px;font-weight:400;margin:0;letter-spacing:2px}.home p{font-size:25px;color:var(--soft);margin:0 0 12px}.homeFox{width:220px;height:265px;animation:float 3s ease-in-out infinite}
.btn{background:#e79759;color:#fff;padding:12px 34px;min-height:56px;border-radius:28px;font-size:23px;box-shadow:0 4px 0 #c97847}.btn:active{transform:translateY(3px);box-shadow:none}
.title{text-align:center;font-size:36px;font-weight:400}.sub{text-align:center;color:var(--soft);font-size:21px}.scene{position:relative;min-height:430px;flex:1;overflow:hidden;border:1px solid #d7c4aa;border-radius:28px;background:linear-gradient(#dce8df 0 56%,#d5e0b8 56%)}.scene:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-18%;height:32%;background:#c4d39f;border-radius:50% 50% 0 0}.sun{position:absolute;right:9%;top:8%;width:66px;height:66px;border-radius:50%;background:#f2cf86}.cloud{position:absolute;left:11%;top:13%;width:110px;height:28px;border-radius:30px;background:#fffaf099}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fffaf099}.cloud:before{width:45px;height:45px;left:14px;top:-18px}.cloud:after{width:35px;height:35px;left:54px;top:-12px}
.char{position:absolute;z-index:5;filter:drop-shadow(0 5px 3px #5d514916)}.char svg{width:100%;height:100%;overflow:visible}.bear{width:185px;height:230px;left:17%;bottom:7%}.rabbit{width:185px;height:230px;right:16%;bottom:7%}.fox{width:135px;height:175px;right:3%;bottom:4%;z-index:8}.ball{position:absolute;width:58px;height:58px;z-index:7}.dialog{position:absolute;z-index:20;left:50%;top:18px;transform:translateX(-50%);max-width:82%;min-width:230px;padding:10px 20px;background:#fffaf0e8;border:1.5px dashed #c8a98d;border-radius:24px;text-align:center;font-size:23px;line-height:1.4;opacity:0}.dialog.show{opacity:1;animation:pop .25s ease}.paper{background:#fffaf0d9;border:1.5px dashed #c9ad92;border-radius:23px}.tap{text-align:center;color:var(--soft);font-size:18px}.storyFox{display:flex;justify-content:center;align-items:center;gap:12px}.storyFox svg{width:74px;height:98px;flex:none}.speech{padding:11px 18px;font-size:23px;line-height:1.45;max-width:760px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choice{min-height:105px;padding:12px;background:#fffaf0c9;border:1.5px dashed #c9ad92;border-radius:22px;font-size:23px}.choice.selected{background:#fff0dc;border-style:solid;border-color:#e49a60}.face{font-size:37px;display:block}.build{display:grid;grid-template-columns:1fr 1fr;gap:12px}.build button{min-height:90px;padding:12px;background:#fffaf0d9;border:1.5px dashed #c9ad92;border-radius:22px;font-size:22px}.build button.selected{background:#fff0dc;border-style:solid;border-color:#e49a60}.sentence{padding:14px 20px;text-align:center;font-size:29px;line-height:1.5;background:#fff0dc;border:1.5px solid #dfb38a;border-radius:24px}.voiceRow{text-align:center}.replay{background:#fffaf0;border:1px solid #c9ad92;border-radius:20px;padding:7px 14px;font-size:18px}.solutions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.solution{background:#fffaf0;border:1.5px dashed #c9ad92;border-radius:23px;overflow:hidden}.solution.selected{border-style:solid;border-color:#e49a60;background:#fff0dc}.solution .pic{height:190px;background:#e6eddc;display:flex;align-items:center;justify-content:center}.solution svg{width:94%;height:94%}.solution .label{text-align:center;padding:9px;font-size:22px}.result{text-align:center;font-size:22px;line-height:1.5;padding:12px 18px}.summary{align-items:center;justify-content:center;text-align:center}.summary h2{font-size:40px;font-weight:400;margin:0}.summary p{font-size:25px;line-height:1.6}
/* hand-drawn IP system */
.outline{stroke:#715b4d;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.rough{filter:url(#rough)}.pencil{stroke:#866b58;stroke-width:1.1;fill:none;opacity:.42;stroke-linecap:round}.thin{stroke:#715b4d;stroke-width:1.7;fill:none;stroke-linecap:round}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pop{from{opacity:.2;transform:translateX(-50%) scale(.96)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes roll{from{transform:translate(0,0) rotate(0)}to{transform:translate(240px,0) rotate(720deg)}}
@keyframes walk{0%{transform:translate(0,0)}65%{transform:translate(-90px,10px)}100%{transform:translate(-112px,18px)}}
@keyframes crouch{from{transform:translate(-112px,18px)}to{transform:translate(-112px,28px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-9px)}}
.walk{animation:walk 1.15s cubic-bezier(.2,.75,.25,1) forwards}.crouch{animation:crouch .35s ease forwards}.roll{animation:roll 1.05s cubic-bezier(.2,.75,.25,1) forwards}.bounce{animation:bounce .7s ease}
.standing{opacity:1}.crouching{opacity:0}.crouchMode .standing{opacity:0}.crouchMode .crouching{opacity:1}
@media(max-width:720px){.page{padding:18px 13px 30px}.title{font-size:31px}.sub{font-size:19px}.scene{min-height:400px}.bear,.rabbit{width:145px;height:180px}.bear{left:3%}.rabbit{right:3%}.fox{width:100px;height:135px}.choices{grid-template-columns:1fr 1fr}.build,.solutions{grid-template-columns:1fr}.solution .pic{height:150px}.home h1{font-size:39px}.sentence{font-size:23px}.dialog{font-size:20px}}
</style>
</head>
<body><div id="app">
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/></filter>
<symbol id="fox" viewBox="0 0 180 220"><g class="rough"><path d="M47 76L34 28L70 48Q90 40 110 48L146 28L133 76Q141 94 136 111Q128 137 90 142Q52 137 44 111Q39 94 47 76Z" fill="#e88945" class="outline"/><path d="M50 113Q90 96 130 113Q124 139 90 145Q56 139 50 113Z" fill="#fff8ed"/><ellipse cx="67" cy="88" rx="5.5" ry="7" fill="#554942"/><ellipse cx="113" cy="88" rx="5.5" ry="7" fill="#554942"/><circle cx="65.5" cy="85.5" r="1.8" fill="#fff"/><circle cx="111.5" cy="85.5" r="1.8" fill="#fff"/><path d="M84 101Q90 96 96 101Q90 108 84 101Z" fill="#554942"/><path d="M82 114Q90 120 98 114" class="thin"/><path d="M61 140Q51 160 56 193Q73 204 90 198Q107 204 124 193Q129 160 119 140" fill="#e88945" class="outline"/><path d="M67 147Q90 139 113 147L112 187Q90 195 68 187Z" fill="#73a39d"/><path d="M64 151Q43 163 37 183M116 151Q137 163 143 183" class="thin"/><path d="M74 194L68 211M106 194L112 211" class="thin"/><path d="M45 57L59 47M135 57L121 47M52 132Q60 124 68 130M112 130Q120 124 128 132" class="pencil"/></g></symbol>
<symbol id="bear" viewBox="0 0 180 220"><g class="rough"><circle cx="53" cy="53" r="22" fill="#b78460" class="outline"/><circle cx="127" cy="53" r="22" fill="#b78460" class="outline"/><ellipse cx="90" cy="94" rx="47" ry="49" fill="#b78460" class="outline"/><ellipse cx="90" cy="113" rx="24" ry="17" fill="#e8cfb5"/><ellipse cx="72" cy="89" rx="5.3" ry="6.7" fill="#554942"/><ellipse cx="108" cy="89" rx="5.3" ry="6.7" fill="#554942"/><circle cx="70.5" cy="86.5" r="1.8" fill="#fff"/><circle cx="106.5" cy="86.5" r="1.8" fill="#fff"/><ellipse cx="90" cy="105" rx="6.5" ry="4.7" fill="#554942"/><path d="M81 117Q90 124 99 117" class="thin"/><ellipse cx="90" cy="169" rx="54" ry="53" fill="#b78460" class="outline"/><path d="M49 156Q27 169 22 191M131 156Q153 169 158 191" class="thin"/><path d="M70 207L66 219M110 207L114 219" class="thin"/><path d="M50 73Q60 67 69 72M111 72Q120 67 130 73" class="pencil"/></g></symbol>
<symbol id="bearCrouch" viewBox="0 0 180 220"><g class="rough"><circle cx="55" cy="88" r="20" fill="#b78460" class="outline"/><circle cx="125" cy="88" r="20" fill="#b78460" class="outline"/><ellipse cx="90" cy="116" rx="48" ry="43" fill="#b78460" class="outline"/><ellipse cx="90" cy="131" rx="24" ry="16" fill="#e8cfb5"/><ellipse cx="72" cy="112" rx="5.2" ry="6.5" fill="#554942"/><ellipse cx="108" cy="112" rx="5.2" ry="6.5" fill="#554942"/><path d="M82 140Q90 134 98 140" class="thin"/><ellipse cx="90" cy="178" rx="64" ry="30" fill="#b78460" class="outline"/><path d="M45 178Q28 184 22 199M135 178Q152 184 158 199" class="thin"/><path d="M62 201Q73 211 82 213M118 201Q107 211 98 213" class="thin"/></g></symbol>
<symbol id="rabbit" viewBox="0 0 180 220"><g class="rough"><path d="M61 70Q36 15 56 17Q74 21 78 69M119 70Q144 15 124 17Q106 21 102 69" fill="#fff8ed" class="outline"/><path d="M61 39Q54 30 57 53M119 39Q126 30 123 53" stroke="#e7aeb8" stroke-width="5" fill="none"/><ellipse cx="90" cy="95" rx="45" ry="50" fill="#fff8ed" class="outline"/><ellipse cx="90" cy="177" rx="51" ry="49" fill="#fff8ed" class="outline"/><circle cx="73" cy="91" r="5.3" fill="#554942"/><circle cx="107" cy="91" r="5.3" fill="#554942"/><circle cx="71.5" cy="88.5" r="1.8" fill="#fff"/><circle cx="105.5" cy="88.5" r="1.8" fill="#fff"/><path d="M84 106Q90 101 96 106Q90 113 84 106Z" fill="#554942"/><path d="M82 119Q90 125 98 119" class="thin"/><path d="M56 156Q34 171 28 193M124 156Q146 171 152 193" class="thin"/><path d="M71 211L67 220M109 211L113 220" class="thin"/><path d="M63 150Q90 142 117 150L113 188Q90 194 67 188Z" fill="#b69ac6"/><path d="M49 83Q57 76 64 82M116 82Q123 76 131 84" class="pencil"/></g></symbol>
</defs></svg>

<section class="page home active" id="p1"><svg class="homeFox"><use href="#fox"/></svg><h1>小狐的心情故事</h1><p>你好，我是小狐</p><button class="btn" onclick="start()">开始故事</button></section>

<section class="page" id="p2"><div class="title">一起玩吧</div><div class="sub">下午，幼儿园的操场上</div><div class="scene" id="scene2"><div class="sun"></div><div class="cloud"></div><div class="dialog" id="d2"></div><div class="char bear" id="b2"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r2"><svg><use href="#rabbit"/></svg></div><div class="ball" id="ball2" style="left:40%;bottom:31%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="29" fill="#fffaf0" class="outline"/><path d="M25 21L35 16L46 23L42 35L29 35Z" fill="#73a39d"/><path d="M25 21L15 31M46 23L55 33M29 35L22 49M42 35L49 49" class="thin"/></svg></div></div><div class="tap">小熊和小兔正在玩积木……</div><button class="btn hide" id="n2" onclick="go(3)">继续</button></section>

<section class="page" id="p3"><div class="title">发生了什么？</div><div class="scene" id="scene3"><div class="sun"></div><div class="cloud"></div><div class="dialog" id="d3"></div><div class="char bear" id="b3"><div class="standing"><svg><use href="#bear"/></svg></div><div class="crouching"><svg><use href="#bearCrouch"/></svg></div></div><div class="char rabbit" id="r3"><svg><use href="#rabbit"/></svg></div><div class="ball" style="left:47%;bottom:28%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="29" fill="#fffaf0" class="outline"/><path d="M25 21L35 16L46 23L42 35L29 35Z" fill="#73a39d"/><path d="M25 21L15 31M46 23L55 33M29 35L22 49M42 35L49 49" class="thin"/></svg></div></div><div class="tap">看一看，小熊后来怎么了？</div></section>

<section class="page" id="p4"><div class="title">小熊怎么了？</div><div class="storyFox"><svg><use href="#fox"/></svg><div class="speech" id="foxSpeech">你发现了吗？小熊好像和刚才不一样了。</div></div><div class="choices"><button class="choice" onclick="emotion('生气',this)"><span class="face">😠</span>生气</button><button class="choice" onclick="emotion('难过',this)"><span class="face">😢</span>难过</button><button class="choice" onclick="emotion('委屈',this)"><span class="face">🥺</span>委屈</button><button class="choice" onclick="emotion('不知道',this)"><span class="face">🤔</span>不知道</button></div><button class="btn hide" id="n4" onclick="go(5)">继续</button></section>

<section class="page" id="p5"><div class="title">帮小熊说一说</div><div class="storyFox"><svg><use href="#fox"/></svg><div class="speech">我们可以把感觉和原因说出来。</div></div><div class="build"><button id="e1" onclick="pickE('生气',this)">我感到有一点生气</button><button id="e2" onclick="pickE('难过',this)">我感到有一点难过</button><button id="e3" onclick="pickE('委屈',this)">我感到有一点委屈</button></div><div class="build"><button id="r1" onclick="pickR('我也想玩球',this)">因为我也想玩球</button><button id="r2" onclick="pickR('我的想法没有被听见',this)">因为我的想法没有被听见</button></div><div class="sentence" id="sentence">我感到……因为……</div><button class="btn hide" id="tell" onclick="tellRabbit()">告诉小兔</button></section>

<section class="page" id="p6"><div class="title">再来一次</div><div class="scene" id="scene6"><div class="sun"></div><div class="cloud"></div><div class="char bear" style="left:21%"><svg><use href="#bear"/></svg></div><div class="char rabbit" style="right:18%"><svg><use href="#rabbit"/></svg></div><div class="dialog" id="d6"></div></div><div class="solutions"><button class="solution" onclick="solve('表达',this)"><div class="pic"><svg viewBox="0 0 180 140"><use href="#bear" x="5" y="-35" width="75" height="120"/><use href="#rabbit" x="100" y="-35" width="75" height="120"/><path d="M65 42Q90 20 112 42" class="thin"/><path d="M79 30l-8-10M98 29l8-10" class="pencil"/></svg></div><div class="label">说出自己的感觉</div></button><button class="solution" onclick="solve('停一下',this)"><div class="pic"><svg viewBox="0 0 180 140"><use href="#bearCrouch" x="20" y="-45" width="140" height="170"/><path d="M28 113Q90 92 153 113" class="pencil"/></svg></div><div class="label">先停一下</div></button><button class="solution" onclick="solve('找老师',this)"><div class="pic"><svg viewBox="0 0 180 140"><use href="#bear" x="8" y="-45" width="70" height="105"/><circle cx="139" cy="37" r="29" fill="#e6b990" class="outline"/><path d="M111 76Q139 57 167 76L172 128H106Z" fill="#8fb6ad" class="outline"/><path d="M78 55Q95 42 111 55" class="thin"/></svg></div><div class="label">找老师帮忙</div></button></div><div class="result paper" id="result6">如果重新来一次，小熊可以换一种办法。</div><button class="btn hide" id="n6" onclick="go(7)">继续</button></section>

<section class="page" id="p7"><div class="title">今天的小发现</div><div class="storyFox"><svg><use href="#fox"/></svg><div class="speech">生气、难过、委屈，都可以说出来。说出来以后，我们还可以一起想办法。</div></div><div class="sentence">我可以有感觉，也可以选择怎么做。</div><button class="btn" onclick="go(1)">再听一次</button></section>
</div>
<script>
let timer=[];let emo='';let reason='';
const $=id=>document.getElementById(id);
function go(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$('p'+n).classList.add('active');window.scrollTo(0,0);clearTimers();if(n===2)playScene2();if(n===3)playScene3();if(n===4)playPage4();if(n===6)playPage6()}
function clearTimers(){timer.forEach(clearTimeout);timer=[]}
function later(fn,ms){timer.push(setTimeout(fn,ms))}
function start(){go(2)}
function speak(id,text){const d=$(id);d.textContent=text;d.classList.remove('show');void d.offsetWidth;d.classList.add('show');speakVoice(text)}
function speakVoice(text){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.88;u.pitch=1.05;speechSynthesis.speak(u)}}
function playScene2(){const b=$('b2'),r=$('r2'),ball=$('ball2'),n=$('n2');n.classList.add('hide');b.classList.remove('bounce');r.classList.remove('bounce');ball.classList.remove('roll');later(()=>{b.classList.add('bounce');speak('d2','小熊：我们一起玩积木吧！');},500);later(()=>{r.classList.add('bounce');speak('d2','小兔：好呀！');},2100);later(()=>{ball.classList.add('roll');},3400);later(()=>{speak('d2','小熊：咦？球滚过来了！');},4550);later(()=>{speak('d2','小兔：我也想玩！');},5900);later(()=>{speak('d2','小熊：我也想玩！');},7200);later(()=>{b.classList.add('bounce');r.classList.add('bounce');speak('d2','小熊和小兔：我要玩！');},8500);later(()=>n.classList.remove('hide'),10000)}
function playScene3(){const b=$('b3'),r=$('r3');b.classList.remove('walk','crouch','crouchMode');later(()=>speak('d3','小熊：我不玩了！'),500);later(()=>{b.classList.add('walk');speak('d3','小熊：哼……'),1900});later(()=>{b.classList.add('crouch');later(()=>b.classList.add('crouchMode'),320);speak('d3','小熊躲到角落里了。');},3400);later(()=>{r.classList.remove('bounce');speak('d3','小兔还在玩球。');},5200);later(()=>go(4),6900)}
function playPage4(){speak('foxSpeech','你发现了吗？小熊好像和刚才不一样了。');later(()=>speakVoice('我们一起看看，小熊可能是什么感觉？'),1700)}
function emotion(x,el){emo=x;document.querySelectorAll('#p4 .choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');const msg=x==='不知道'?'没关系，我们可以再看看小熊发生了什么。':'你发现小熊可能有一点'+x+'。';$('foxSpeech').textContent=msg;speakVoice(msg);later(()=>go(5),900)}
function pickE(x,el){emo=x;document.querySelectorAll('#p5 .build button').forEach(b=>{if(b.id.startsWith('e'))b.classList.remove('selected')});el.classList.add('selected');updateSentence()}
function pickR(x,el){reason=x;document.querySelectorAll('#p5 .build button').forEach(b=>{if(b.id.startsWith('r'))b.classList.remove('selected')});el.classList.add('selected');updateSentence()}
function updateSentence(){let s='我感到……因为……';if(emo&&reason)s='我感到有一点'+emo+'，因为'+reason+'。';$('sentence').textContent=s;if(emo&&reason){$('tell').classList.remove('hide');speakVoice(s)}}
function tellRabbit(){const full='我感到有一点'+emo+'，因为'+reason+'。我们可以一起玩吗？';$('sentence').textContent=full;speakVoice('小熊：'+full);later(()=>go(6),2200)}
function playPage6(){later(()=>speak('d6','小兔：可以呀！那我们一人站一边传球，好不好？'),700);later(()=>{$('n6').classList.remove('hide')},2600)}
function solve(x,el){document.querySelectorAll('.solution').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');const r={表达:'小熊把感觉说出来，小兔也听见了。', '停一下':'小熊先停下来，等自己平静一点，再说出自己的想法。','找老师':'小熊请老师帮忙，大家一起想办法。'}[x];$('result6').textContent=r;speakVoice(r);$('n6').classList.remove('hide')}
</script></body></html>
