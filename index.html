<style>
:root{--paper:#fbf5e9;--ink:#65564d;--soft:#907b6d;--orange:#dc8750;--bear:#b98b6c;--bear2:#d8b596;--rabbit:#f8f1e5;--pink:#d7a9ad;--scarf:#7eaaa1;--green:#c7d39f;--sky:#dfe8df;--yellow:#ead09a;--line:#806a5b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8ded0;color:var(--ink)}body{font-family:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",cursive,sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{width:min(1120px,100%);min-height:100svh;margin:auto;background:var(--paper);position:relative;overflow:hidden}#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.26;background-image:radial-gradient(#9a806d .55px,transparent .75px);background-size:7px 7px;mix-blend-mode:multiply;z-index:100}
.page{display:none;min-height:100svh;padding:22px clamp(18px,5vw,66px) 30px;gap:12px;position:relative}.page.active{display:flex;flex-direction:column}.home{align-items:center;justify-content:center;text-align:center;gap:7px}.home h1{font-size:48px;font-weight:400;margin:0}.home p{font-size:24px;margin:0 0 12px;color:var(--soft)}.homeFox{width:220px;height:270px;animation:float 3.2s ease-in-out infinite}
.btn{background:#df935c;color:#fff;padding:11px 32px;min-height:54px;border-radius:24px;font-size:23px;box-shadow:0 4px 0 #bf774d}.btn:active{transform:translateY(3px);box-shadow:none}.title{text-align:center;font-size:35px;font-weight:400}.sub{text-align:center;color:var(--soft);font-size:20px}
.scene{position:relative;min-height:430px;flex:1;overflow:hidden;border:1.5px solid #d0b79c;border-radius:26px;background:var(--sky)}.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(164deg,transparent 0 19px,#8f76620b 20px 21px);mix-blend-mode:multiply}.ground{position:absolute;left:-10%;right:-10%;bottom:-18%;height:40%;background:var(--green);border-radius:50% 50% 0 0}.sun{position:absolute;right:9%;top:8%;width:66px;height:66px;border-radius:50%;background:var(--yellow)}.cloud{position:absolute;left:11%;top:14%;width:105px;height:24px;border-radius:30px;background:#fff9ed99}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fff9ed99}.cloud:before{width:44px;height:44px;left:14px;top:-18px}.cloud:after{width:34px;height:34px;left:54px;top:-11px}
.char{position:absolute;z-index:5;filter:drop-shadow(0 5px 2px #6b554518)}.char svg{width:100%;height:100%;overflow:visible}.bear{width:205px;height:245px;left:14%;bottom:5%}.rabbit{width:205px;height:245px;right:13%;bottom:5%}.fox{width:150px;height:190px;right:3%;bottom:3%;z-index:8}
.dialog{position:absolute;z-index:20;left:50%;top:16px;transform:translateX(-50%);max-width:82%;min-width:220px;padding:11px 20px;background:#fffaf0e8;border:2px solid #b99678;border-radius:28px 23px 26px 21px;text-align:center;font-size:24px;line-height:1.4;opacity:0}.dialog.show{opacity:1;animation:pop .22s ease}.dialog:after{content:"";position:absolute;left:48%;bottom:-11px;width:17px;height:17px;background:#fffaf0e8;border-right:2px solid #b99678;border-bottom:2px solid #b99678;transform:rotate(45deg)}
.storyFox{display:flex;justify-content:center;align-items:center;gap:10px}.storyFox svg{width:72px;height:94px;flex:none}.speech{padding:9px 17px;font-size:22px;line-height:1.4;max-width:760px;background:#fffaf0d9;border:2px solid #b99678;border-radius:24px 20px 25px 19px}.paper{background:#fffaf0d9;border:2px solid #b99678;border-radius:24px 20px 25px 19px}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.choice{min-height:100px;padding:11px;background:#fffaf0c9;border:2px solid #c5aa90;border-radius:22px 18px 23px 20px;font-size:22px}.choice.selected{background:#fff0dc;border-color:#db925d}.face{font-size:34px;display:block}
.twoCols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col{padding:13px}.colTitle{text-align:center;font-size:26px;margin-bottom:8px}.optionList{display:grid;gap:9px}.option{min-height:67px;padding:8px 12px;background:#fffaf0b8;border:2px dashed #c5aa90;border-radius:18px 22px 17px 20px;font-size:21px}.option.selected{background:#fff0dc;border-style:solid;border-color:#db925d}.sentence{padding:13px 18px;text-align:center;font-size:28px;line-height:1.5;background:#fff0dc;border:2px solid #d9ad87;border-radius:25px 20px 24px 18px}.voiceRow{text-align:center;display:flex;gap:10px;justify-content:center}.replay{background:#fffaf0;border:2px solid #c5aa90;border-radius:20px;padding:7px 14px;font-size:18px}
.solutions{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.solution{background:#fffaf0;border:2px dashed #c5aa90;border-radius:24px 19px 23px 20px;overflow:hidden}.solution.selected{border-style:solid;border-color:#db925d;background:#fff0dc}.solution .pic{height:195px;background:#e5ebdc;display:flex;align-items:center;justify-content:center}.solution svg{width:95%;height:95%}.solution .label{text-align:center;padding:8px;font-size:22px}.result{text-align:center;font-size:22px;line-height:1.5;padding:11px 17px}.hide{display:none!important}.tap{text-align:center;color:var(--soft);font-size:19px}.summary{align-items:center;justify-content:center;text-align:center}.summary h2{font-size:40px;font-weight:400;margin:0}.summary p{font-size:25px;line-height:1.6}
.outline{stroke:var(--line);stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.pencil{stroke:#8b705e;stroke-width:1.25;fill:none;opacity:.52;stroke-linecap:round;stroke-linejoin:round}.pencil2{stroke:#a48770;stroke-width:.9;fill:none;opacity:.38;stroke-linecap:round}.thin{stroke:#806858;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pop{from{opacity:.15;transform:translateX(-50%) scale(.96)}to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes ballroll{from{transform:translateX(0) rotate(0)}to{transform:translateX(245px) rotate(720deg)}}@keyframes look{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}.talk{animation:talk .52s ease-in-out infinite}.blink{transform-origin:center;animation:blink 4.2s infinite}.look{animation:look .8s ease-in-out}.shake{animation:shake .42s ease-in-out}.ballroll{animation:ballroll 1.25s cubic-bezier(.2,.75,.25,1) forwards}
@media(max-width:720px){.page{padding:17px 12px 27px}.title{font-size:31px}.sub{font-size:18px}.scene{min-height:400px}.bear,.rabbit{width:150px;height:185px}.bear{left:1%}.rabbit{right:1%}.fox{width:104px;height:140px}.choices{grid-template-columns:1fr 1fr}.twoCols,.solutions{grid-template-columns:1fr}.solution .pic{height:155px}.home h1{font-size:39px}.sentence{font-size:23px}.dialog{font-size:20px}.storyFox svg{width:58px;height:80px}}
</style></head><body><div id="app">

</defs></svg>
<section class="page home active" id="p1"><svg class="homeFox"><use href="#fox"/></svg><h1>小狐的心情故事</h1><p>你好，我是小狐</p><button class="btn" onclick="startStory()">开始故事</button></section>
<section class="page" id="p2"><div class="title">一起玩吧</div><div class="sub">下午，幼儿园里</div><div class="scene"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="char bear" id="b2"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r2"><svg><use href="#rabbit"/></svg></div><div class="ball" id="ball2" style="position:absolute;left:27%;bottom:28%;width:58px;height:58px;z-index:7"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fbf1df" stroke="#8b6b58" stroke-width="2.5"/><path d="M13 30Q34 19 55 30M20 49Q34 39 48 49M28 8Q34 20 40 8" fill="none" stroke="#d69b6b" stroke-width="2"/></svg></div><div class="dialog" id="d2"></div></div></section>
<section class="page" id="p3"><div class="title">发生了什么？</div><div class="scene"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="dialog" id="d3"></div><div class="char bear" id="b3"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r3"><svg><use href="#rabbit"/></svg></div><div class="ball" style="position:absolute;left:44%;bottom:30%;width:58px;height:58px"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fbf1df" stroke="#8b6b58" stroke-width="2.5"/><path d="M13 30Q34 19 55 30M20 49Q34 39 48 49" fill="none" stroke="#d69b6b" stroke-width="2"/></svg></div></div></section>
<section class="page" id="p4"><div class="title">小熊怎么了？</div><div class="scene"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="char bear" id="b4"><svg><use href="#bearCrouch"/></svg></div><div class="char rabbit" id="r4"><svg><use href="#rabbit"/></svg></div></div><div class="storyFox"><svg><use href="#fox"/></svg><div class="speech paper" id="foxQuestion">你发现了吗？小熊好像和刚才不一样了。<br>你觉得小熊怎么了？</div></div><div class="choices" id="emotionChoices"><button class="choice" onclick="chooseEmotion('生气',this)"><span class="face">😡</span>生气</button><button class="choice" onclick="chooseEmotion('难过',this)"><span class="face">😢</span>难过</button><button class="choice" onclick="chooseEmotion('委屈',this)"><span class="face">😞</span>委屈</button><button class="choice" onclick="chooseEmotion('不知道',this)"><span class="face">🤔</span>不知道</button></div></section>
<section class="page" id="p5"><div class="title">帮小熊说一说</div><div class="sub">选一选，小熊可以怎么说</div><div class="twoCols"><div class="col paper"><div class="colTitle">小熊的感觉</div><div class="optionList"><button class="option" onclick="pickFeeling('生气',this)">生气</button><button class="option" onclick="pickFeeling('难过',this)">难过</button><button class="option" onclick="pickFeeling('有一点委屈',this)">有一点委屈</button></div></div><div class="col paper"><div class="colTitle">为什么呢？</div><div class="optionList"><button class="option" onclick="pickReason('因为我也想玩球',this)">因为我也想玩球</button><button class="option" onclick="pickReason('因为我的想法没有被听见',this)">因为我的想法没有被听见</button><button class="option" onclick="pickReason('因为我觉得不公平',this)">因为我觉得不公平</button></div></div></div><div class="sentence" id="sentence">我感到……，因为……</div><div class="voiceRow"><button class="replay" onclick="speakSentence()">🔊 听一听</button><button class="btn" onclick="tellRabbit()">告诉小兔</button></div></section>
<section class="page" id="p6"><div class="title">小熊说出来了</div><div class="scene"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="char bear" id="b6"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r6"><svg><use href="#rabbit"/></svg></div><div class="dialog" id="d6"></div></div><div class="tap">听听他们怎么说</div><button class="btn" style="align-self:center" onclick="goPage(7)">继续</button></section>
<section class="page" id="p7"><div class="title">重新来一次</div><div class="sub">如果重新来一次，小熊可以怎么做？</div><div class="solutions"><button class="solution" onclick="chooseSolution(0,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="22" y="0" width="100" height="122"/><path d="M125 104Q145 94 168 104" class="pencil"/><path d="M148 72L148 103" class="thin"/></svg></div><div class="label">停下来</div></button><button class="solution" onclick="chooseSolution(1,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="13" y="2" width="100" height="122"/><path d="M104 67Q139 51 184 68" class="thin"/><path d="M132 58Q143 44 156 57" class="pencil"/></svg></div><div class="label">说出感觉</div></button><button class="solution" onclick="chooseSolution(2,this)"><div class="pic"><svg viewBox="0 0 220 150"><use href="#bear" x="8" y="17" width="92" height="112"/><path d="M120 40Q143 22 168 40" class="thin"/><path d="M147 42L147 103" class="thin"/><circle cx="147" cy="31" r="4" fill="#806958"/></svg></div><div class="label">找老师帮忙</div></button></div><div class="result paper" id="result7"></div><button class="btn hide" id="next7" style="align-self:center" onclick="goPage(8)">继续</button></section>
<section class="page summary"><div class="summary"><svg class="homeFox"><use href="#fox"/></svg><h2>今天，你帮助了小熊。</h2><p>看见感觉<br>说出感觉和原因<br>再一起想办法</p><button class="btn" onclick="location.reload()">再来一次</button></div></section>
</div>
<script>
let feeling='',reason='';const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
function goPage(n){speechSynthesis.cancel();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p'+n)?.classList.add('active')}
let voiceBank=[];function loadVoices(){const a=speechSynthesis.getVoices();voiceBank=a.filter(v=>/^zh[-_]/i.test(v.lang)||/Chinese|中文|Mandarin|普通话/i.test(v.name))}speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
const VP={fox:{rate:.96,pitch:1.28,names:['Yaoyao','Xiaoxiao','Ting-Ting','Mei-Jia','女','Female']},bear:{rate:.82,pitch:.76,names:['Kangkang','Yunxi','男','Male','Daniel','Li-Mu']},rabbit:{rate:1.04,pitch:1.10,names:['Huihui','Sinji','Ting-Ting','女','Female']}};
function pickVoice(who){const p=VP[who]||VP.fox;for(const q of p.names){const v=voiceBank.find(x=>new RegExp(q,'i').test(x.name));if(v)return v}if(!voiceBank.length)return null;return voiceBank[who==='fox'?0:who==='bear'?Math.min(1,voiceBank.length-1):Math.min(2,voiceBank.length-1)]}
function splitSpeech(t){return t.replace(/([。！？!?])/g,'$1|').split('|').map(x=>x.trim()).filter(Boolean)}
function speak(text,who='fox'){const p=VP[who]||VP.fox,v=pickVoice(who);speechSynthesis.cancel();return new Promise(resolve=>{const arr=splitSpeech(text);let i=0;function next(){if(i>=arr.length){resolve();return}const u=new SpeechSynthesisUtterance(arr[i++]);u.lang=v?.lang||'zh-CN';if(v)u.voice=v;u.rate=p.rate;u.pitch=p.pitch;u.volume=1;u.onend=()=>setTimeout(next,arr.length>1?100:0);u.onerror=()=>setTimeout(next,50);speechSynthesis.speak(u)}next()})}
async function speakAndWait(id,text,who){const el=$(id);el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show','talk');const min=Math.max(900,text.length*120);await Promise.all([speak(text,who),wait(min)]);el.classList.remove('talk')}
async function startStory(){goPage(2);await wait(450);playP2()}
async function playP2(){const b=$('b2'),r=$('r2'),ball=$('ball2');b.classList.add('look');r.classList.add('look');await wait(900);ball.classList.add('ballroll');await wait(1300);ball.classList.remove('ballroll');await wait(250);await speakAndWait('d2','这个球是我的！','bear');await wait(180);await speakAndWait('d2','我也要玩！','rabbit');await wait(300);goPage(3);playP3()}
async function playP3(){await wait(300);await speakAndWait('d3','给我！','bear');await wait(160);await speakAndWait('d3','不要，我先看到的！','rabbit');await wait(230);await speakAndWait('d3','诶，我不玩了……我不要了，我不玩了。','bear');const b=$('b3');b.classList.add('shake');await wait(430);b.classList.remove('shake');b.style.left='6%';b.style.bottom='1%';b.querySelector('svg').innerHTML='<use href="#bearCrouch"/>';await wait(800);goPage(4)}
async function chooseEmotion(v,btn){document.querySelectorAll('#emotionChoices .choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');const t=v==='不知道'?'没关系，我们可以再看看小熊发生了什么。':`你发现小熊可能有一点${v}。`;await speak(t,'fox');if(v!=='不知道')goPage(5)}
function pickFeeling(v,b){feeling=v;document.querySelectorAll('.col:first-child .option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');updateSentence()}function pickReason(v,b){reason=v;document.querySelectorAll('.col:last-child .option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');updateSentence()}function updateSentence(){if(feeling&&reason)$('sentence').textContent=`我感到${feeling}，${reason}。我们可以一起玩吗？`}function speakSentence(){if(feeling&&reason)speak($('sentence').textContent,'bear')}
async function tellRabbit(){if(!feeling||!reason)return;goPage(6);await wait(300);await speakAndWait('d6',$('sentence').textContent,'bear');await wait(220);await speakAndWait('d6','可以呀！那我们一人站一边传球，好不好？','rabbit')}
async function chooseSolution(i,b){document.querySelectorAll('.solution').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const t=['小熊先停下来，等自己慢一点，再说出自己的感觉。','小熊说：“我感到有一点委屈，因为我也想玩球。”','小熊去找老师：“老师，我和小兔都想玩这个球。”'];$('result7').textContent=t[i];$('next7').classList.remove('hide');await speak(t[i],'fox')}
</script></body></html>
