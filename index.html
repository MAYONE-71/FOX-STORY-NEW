<script>
let current=1, timers=[], selectedEmotion='', selectedWhy='', feel='', reason='';
const $=id=>document.getElementById(id);
function clearTimers(){timers.forEach(clearTimeout);timers=[];speechSynthesis.cancel();document.querySelectorAll('.speech').forEach(x=>x.classList.remove('show'));}
function go(n){clearTimers();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$('p'+n).classList.add('active');current=n;runPage(n);}
function say(text,who='fox',delay=0){timers.push(setTimeout(()=>{const voice=document.querySelector('#p'+current+' .'+who); if(voice)voice.classList.add('talk'); const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=who==='bear'?.82:who==='rabbit'?1.02:.94;u.pitch=who==='bear'?.78:who==='rabbit'?1.12:1.2;u.volume=1;speechSynthesis.speak(u);u.onend=()=>voice&&voice.classList.remove('talk')},delay));}
function show(id,delay=0){timers.push(setTimeout(()=>$(id)?.classList.add('show'),delay));}
function startStory(){go(2)}
function runPage(n){
