<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小狐的心情故事</title><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#d8d0c5}body{font-family:'Ma Shan Zheng',cursive;color:#5b5047}.book{position:relative;width:min(1280px,100vw);height:100svh;min-height:620px;margin:auto;overflow:hidden;background:#fbf6e9}canvas{position:absolute;inset:0;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.ui>*{pointer-events:auto}.bubble{position:absolute;display:none;max-width:min(470px,72vw);padding:14px 24px;background:#fff9ed;border:2px solid #8d7968;border-radius:48% 52% 50% 46%;font-size:30px;line-height:1.45;box-shadow:3px 4px 0 #0000000c}.bubble.show{display:block}.b1{left:22%;top:11%}.b2{right:20%;top:11%}.b3{left:11%;top:12%}.title{position:absolute;top:7%;width:100%;text-align:center;font-size:54px}.sub{position:absolute;top:17%;width:100%;text-align:center;font-size:24px;color:#88786a}.btn{position:absolute;border:2px solid #8d7968;background:#ead09a;color:#5b5047;border-radius:48% 52% 47% 53%;font:28px 'Ma Shan Zheng',cursive;padding:9px 28px;cursor:pointer;box-shadow:4px 5px 0 #00000010}.start{left:50%;bottom:9%;transform:translateX(-50%)}.next{right:3%;bottom:3%;background:#fff9ed;font-size:22px;padding:6px 16px}.foxwords{position:absolute;left:7%;top:7%;max-width:430px;font-size:27px;background:#fff9eddd;padding:12px 19px;border:2px solid #8d7968;border-radius:45%}.choices{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.choice{border:2px dashed #9a8774;background:#fff9ed;color:#5b5047;border-radius:48%;font:25px 'Ma Shan Zheng';padding:9px 20px;cursor:pointer}.choice.on{background:#e8cf95}.feedback{position:absolute;left:50%;top:25%;transform:translateX(-50%);font-size:28px;background:#fff9eddd;padding:9px 20px;border-radius:50%;display:none}.feedback.show{display:block}.expr{position:absolute;left:7%;right:7%;bottom:7%;display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#fff9eddd;border:2px solid #9a8774;border-radius:24px;padding:12px}.card h3{text-align:center;font-weight:400;font-size:27px;margin:0 0 7px}.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.opt{border:1.5px solid #aa927d;background:#fff9ed;border-radius:45%;font:21px 'Ma Shan Zheng';padding:6px 13px;cursor:pointer}.opt.on{background:#e8cf95}.sentence{position:absolute;left:50%;bottom:42%;transform:translateX(-50%);width:86%;text-align:center;background:#fff9edee;border:2px solid #8d7968;border-radius:48%;padding:11px 18px;font-size:29px}.tell{position:absolute;left:50%;bottom:23%;transform:translateX(-50%)}.end{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:84%;text-align:center;font-size:39px;line-height:1.55}.smallend{position:absolute;top:33%;left:50%;transform:translateX(-50%);font-size:28px;white-space:nowrap}@media(max-width:700px){.title{font-size:42px}.sub{font-size:19px}.bubble{font-size:20px}.foxwords{font-size:19px;max-width:270px}.choice{font-size:18px;padding:7px 11px}.expr{left:3%;right:3%;gap:7px}.card h3{font-size:20px}.opt{font-size:16px}.sentence{font-size:21px}.tell{font-size:20px}.end{font-size:27px}.smallend{font-size:20px}}</style></head><body><main class="book"><canvas id="c"></canvas><div class="ui"><div id="title" class="title"></div><div id="sub" class="sub"></div><div id="bubble" class="bubble"></div><div id="foxwords" class="foxwords"></div><div id="feedback" class="feedback"></div><div id="choices" class="choices"></div><div id="expr" class="expr"></div><div id="sentence" class="sentence"></div><button id="tell" class="btn tell" style="display:none">告诉小兔</button><button id="start" class="btn start">开始故事</button><button id="next" class="btn next" style="display:none">继续 →</button><div id="end" class="end"></div><div id="smallend" class="smallend"></div></div></main><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,page=0,phase=0,voiceTimer=null;const $=id=>document.getElementById(id);const C={paper:'#fbf6e9',ink:'#66584c',line:'#8e7a68',grass:'#d9d8b5',sky:'#e9eee5',fox:'#d98b5d',bear:'#b18d72',rabbit:'#eee0ca',shirt:'#75958f',yellow:'#e8cf95',pink:'#d8aaa5'};
function resize(){dpr=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener('resize',resize);resize();
function rr(cx,cy,w,h,r,fill,stroke=C.line,lw=2){x.beginPath();x.moveTo(cx-w/2+r,cy-h/2);x.lineTo(cx+w/2-r,cy-h/2);x.quadraticCurveTo(cx+w/2,cy-h/2,cx+w/2,cy-h/2+r);x.lineTo(cx+w/2,cy+h/2-r);x.quadraticCurveTo(cx+w/2,cy+h/2,cx+w/2-r,cy+h/2);x.lineTo(cx-w/2+r,cy+h/2);x.quadraticCurveTo(cx-w/2,cy+h/2,cx-w/2,cy+h/2-r);x.lineTo(cx-w/2,cy-h/2+r);x.quadraticCurveTo(cx-w/2,cy-h/2,cx-w/2+r,cy-h/2);x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}
function roughLine(a,b,col=C.line,lw=2){for(let i=0;i<3;i++){x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0]+(Math.random()-.5)*2,b[1]+(Math.random()-.5)*2);x.strokeStyle=col;x.globalAlpha=.3+.18*i;x.lineWidth=lw;x.stroke()}x.globalAlpha=1}
function bg(){x.fillStyle=C.sky;x.fillRect(0,0,W,H);x.fillStyle=C.paper;x.fillRect(0,H*.68,W,H*.32);x.fillStyle=C.grass;x.beginPath();x.moveTo(0,H*.68);x.quadraticCurveTo(W*.25,H*.61,W*.5,H*.68);x.quadraticCurveTo(W*.75,H*.75,W,H*.65);x.lineTo(W,H);x.lineTo(0,H);x.fill();for(let i=0;i<90;i++){let px=Math.random()*W,py=Math.random()*H;x.fillStyle='rgba(100,85,70,.045)';x.fillRect(px,py,Math.random()*2+1,Math.random()*2+1)}}
function bear(px,py,s=1,pose='stand'){x.save();x.translate(px,py);x.scale(s,s);let crouch=pose==='crouch';if(crouch)x.translate(0,42);x.beginPath();x.arc(0,-82,48,0,7);x.fillStyle=C.bear;x.fill();x.strokeStyle=C.line;x.lineWidth=3;x.stroke();x.beginPath();x.arc(-34,-119,15,0,7);x.arc(34,-119,15,0,7);x.fillStyle=C.bear;x.fill();x.stroke();x.fillStyle='#f6ead6';x.beginPath();x.ellipse(0,-76,33,27,0,0,7);x.fill();x.stroke();x.fillStyle=C.ink;x.beginPath();x.arc(-16,-84,4,0,7);x.arc(16,-84,4,0,7);x.fill();x.beginPath();x.arc(0,-74,4,0,7);x.fill();x.beginPath();x.arc(0,-65,12,0,Math.PI);x.stroke();x.beginPath();x.moveTo(-36,-42);x.quadraticCurveTo(0,-24,36,-42);x.lineTo(42,72);x.quadraticCurveTo(0,92,-42,72);x.closePath();x.fillStyle=C.shirt;x.fill();x.stroke();if(crouch){roughLine([-48,65],[-85,85]);roughLine([48,65],[84,86])}else{roughLine([-36,10],[-67,47]);roughLine([36,10],[67,47])}x.restore()}
function rabbit(px,py,s=1,pose='stand'){x.save();x.translate(px,py);x.scale(s,s);x.fillStyle=C.rabbit;x.strokeStyle=C.line;x.lineWidth=3;x.beginPath();x.ellipse(-25,-145,17,55,-.12,0,7);x.ellipse(25,-145,17,55,.12,0,7);x.fill();x.stroke();x.beginPath();x.arc(0,-83,48,0,7);x.fill();x.stroke();x.fillStyle='#f7e9d8';x.beginPath();x.arc(0,-73,31,0,7);x.fill();x.stroke();x.fillStyle=C.ink;x.beginPath();x.arc(-16,-87,4,0,7);x.arc(16,-87,4,0,7);x.fill();x.beginPath();x.arc(0,-77,4,0,7);x.fill();x.beginPath();x.arc(0,-67,11,0,Math.PI);x.stroke();roughLine([-33,-35],[-62,8]);roughLine([33,-35],[62,8]);x.restore()}
function fox(px,py,s=1){x.save();x.translate(px,py);x.scale(s,s);x.fillStyle=C.fox;x.strokeStyle=C.line;x.lineWidth=3;x.beginPath();x.moveTo(-43,-110);x.lineTo(-20,-145);x.lineTo(0,-120);x.lineTo(22,-145);x.lineTo(45,-110);x.quadraticCurveTo(48,-45,0,-28);x.quadraticCurveTo(-48,-45,-43,-110);x.fill();x.stroke();x.fillStyle='#f7ead6';x.beginPath();x.ellipse(0,-76,30,24,0,0,7);x.fill();x.stroke();x.fillStyle=C.ink;x.beginPath();x.arc(-12,-82,4,0,7);x.arc(12,-82,4,0,7);x.fill();x.beginPath();x.arc(0,-72,4,0,7);x.fill();x.beginPath();x.arc(0,-62,10,0,Math.PI);x.stroke();x.fillStyle=C.shirt;rr(0,7,75,76,17,C.shirt,C.line,3);x.restore()}
function ball(px,py,r=20){x.fillStyle='#d7b36d';x.beginPath();x.arc(px,py,r,0,7);x.fill();x.strokeStyle=C.line;x.lineWidth=2;x.stroke();for(let i=0;i<3;i++)roughLine([px-r*.5,py-r*.2+i*7],[px+r*.45,py+r*.1+i*4],C.line,1)}
function scene(){bg();let by=H*.67,ry=H*.67;if(page===1||page===5){bear(W*.28,by,1);rabbit(W*.72,ry,1);ball(W*.5,H*.61,24)}else if(page===2){bear(W*.19,H*.68,.95,'crouch');rabbit(W*.76,H*.67,.95);fox(W*.5,H*.58,.8)}else if(page===3){bear(W*.34,by,1.02);rabbit(W*.66,ry,1);x.save();x.translate(W*.49,H*.56);x.rotate(-.35);roughLine([0,0],[75,-10],C.line,5);x.restore()}else if(page===4){bear(W*.32,by,1);rabbit(W*.68,ry,1);x.font='42px Ma Shan Zheng';x.fillStyle=C.pink;x.fillText('呜……',W*.22,H*.45);x.fillText('呜……',W*.65,H*.45);fox(W*.5,H*.5,.65)}else if(page===6){bear(W*.29,by,1);rabbit(W*.72,ry,1);fox(W*.5,H*.34,.55)}else if(page===7){bear(W*.32,by,1);rabbit(W*.68,ry,1);ball(W*.5,H*.56,22);roughLine([W*.36,H*.53],[W*.64,H*.53],C.line,2)}else if(page===8){fox(W*.5,H*.58,1.15);}
}
function draw(){scene()}
function clearUI(){['title','sub','bubble','foxwords','feedback','choices','expr','sentence','tell','next','end','smallend'].forEach(id=>{let e=$(id);e.style.display='none';e.classList.remove('show')});$('start').style.display=page===0?'block':'none'}
function say(text,role='fox'){if(voiceTimer)clearTimeout(voiceTimer);speechSynthesis.cancel();if(!text)return;let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=role==='bear'?.82:role==='rabbit'?1.02:.94;u.pitch=role==='bear'?.78:role==='rabbit'?1.13:1.25;u.volume=1;speechSynthesis.speak(u)}
function sequence(lines){speechSynthesis.cancel();let i=0;function go(){if(i>=lines.length)return;let [t,r]=lines[i++],u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r==='bear'?.82:r==='rabbit'?1.02:.94;u.pitch=r==='bear'?.78:r==='rabbit'?1.13:1.25;u.onend=()=>setTimeout(go,280);u.onerror=()=>setTimeout(go,280);speechSynthesis.speak(u)}go()}
function render(){clearUI();draw();if(page===0){$('title').textContent='小狐的心情故事';$('title').style.display='block';$('sub').textContent='一个关于生气、表达和一起玩的小故事';$('sub').style.display='block';return}if(page===1){$('bubble').textContent='我要玩！';$('bubble').className='bubble b1 show';$('bubble').style.display='block';$('start').style.display='none';$('next').style.display='block';sequence([['我要玩！','bear'],['我先拿到的，你别抢我！','rabbit'],['诶……我不玩了，我不要了。','bear']])}if(page===2){$('foxwords').textContent='你发现了吗？小熊好像不一样了。\n小熊怎么了？';$('foxwords').style.display='block';let cs=['生气','难过','委屈','不知道'];$('choices').innerHTML=cs.map(v=>`<button class="choice" onclick="chooseEmotion('${v}')">${v}</button>`).join('');$('choices').style.display='flex';say('你发现了吗？小熊好像不一样了。小熊怎么了？','fox')}if(page===3){$('title').textContent='小熊为什么这样做？';$('title').style.display='block';$('sub').textContent='想一想，小熊心里发生了什么。';$('sub').style.display='block';$('sentence').textContent='小熊感到很____，因为____。';$('sentence').style.display='block';$('choices').innerHTML=['生气','难过','委屈','我也想玩球','我觉得不公平','我的想法没有被听见'].map(v=>`<button class="choice" onclick="chooseReason('${v}')">${v}</button>`).join('');$('choices').style.display='flex';sequence([['小熊感到很生气，因为我也想玩球。','bear']])}if(page===4){$('bubble').textContent='可是，小熊这样做，小兔也会很难过。';$('bubble').className='bubble b3 show';$('bubble').style.display='block';$('next').style.display='block';say('可是，小熊这样做，小兔也会很难过。','fox')}if(page===5){$('title').textContent='如果重新来一次……';$('title').style.display='block';$('sub').textContent='小熊已经很生气了，这一次，她可以怎么做？';$('choices').innerHTML=['先走开一下','说出自己的感觉','请老师帮忙'].map(v=>`<button class="choice" onclick="redoChoice('${v}')">${v}</button>`).join('');$('choices').style.display='flex';$('next').style.display='block'}if(page===6){$('title').textContent='帮小熊说一说';$('title').style.display='block';$('expr').innerHTML='<section class="card"><h3>我感到……</h3><div class="opts">'+['有一点委屈','生气','难过'].map(v=>`<button class="opt" onclick="pickFeel('${v}')">${v}</button>`).join('')+'</div></section><section class="card"><h3>因为……</h3><div class="opts">'+['我也想玩球','我觉得不公平','我的想法没有被听见'].map(v=>`<button class="opt" onclick="pickWhy('${v}')">${v}</button>`).join('')+'</div></section>';$('expr').style.display='grid';$('sentence').textContent='我感到有一点委屈，因为我也想玩球。我们可以一起玩吗？';$('sentence').style.display='block';$('tell').style.display='block'}if(page===7){$('bubble').textContent='我感到有一点委屈，因为我也想玩球。我们可以一起玩吗？';$('bubble').className='bubble b1 show';$('bubble').style.display='block';$('next').style.display='block';sequence([['我感到有一点委屈，因为我也想玩球。我们可以一起玩吗？','bear'],['可以呀！那我们一人站一边传球，好不好？','rabbit']])}if(page===8){$('end').innerHTML='刚才，小熊生气了。<br>她说出了自己的感觉，也说出了自己想要什么。';$('end').style.display='block';$('smallend').textContent='原来，生气的时候，也可以把心里的话说出来。';$('smallend').style.display='block';say('原来，生气的时候，也可以把心里的话说出来。','fox')}}
function chooseEmotion(v){$('feedback').textContent='“'+v+'”也可以。每个人的感觉可能不一样。';$('feedback').style.display='block';say(v==='不知道'?'不知道也没关系，我们可以继续看看小熊。':'你觉得小熊是'+v+'，这个想法很有意思。','fox')}function chooseReason(v){$('sentence').textContent='小熊感到很生气，因为'+v+'。';say('小熊感到很生气，因为'+v+'。','fox')}function redoChoice(v){$('feedback').textContent=v+'，也是一种办法。';$('feedback').style.display='block';say(v+'，也是一种办法。','fox')}function pickFeel(v){document.querySelectorAll('.opt').forEach(e=>e.classList.remove('on'));event.target.classList.add('on');$('sentence').textContent='我感到'+v+'，因为我也想玩球。我们可以一起玩吗？'}function pickWhy(v){$('sentence').textContent='我感到有一点委屈，因为'+v+'。我们可以一起玩吗？'}
$('start').onclick=()=>{page=1;render()};$('next').onclick=()=>{page=page===1?2:page===2?3:page===3?4:page===4?5:page===5?6:page===6?7:8;render()};render();</script></body></html>
