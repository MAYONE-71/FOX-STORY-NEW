*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#d9d1c7;color:var(--ink);font-family:"Ma Shan Zheng","STKaiti","KaiTi",cursive}.book{width:min(1280px,100%);height:100svh;min-height:650px;margin:auto;position:relative;overflow:hidden;background:var(--paper)}

/* 手绘纸张：不是规则点阵，而是非常轻的纸纤维 */
.paper:after{content:"";position:absolute;inset:0;opacity:.1;pointer-events:none;background:repeating-linear-gradient(12deg,transparent 0 34px,rgba(110,95,78,.08) 35px,transparent 36px 72px)}

.action{position:absolute;inset:0;pointer-events:none}.action>*{pointer-events:auto}.char{position:absolute;transition:transform .9s cubic-bezier(.2,.75,.2,1),left .9s cubic-bezier(.2,.75,.2,1),bottom .9s cubic-bezier(.2,.75,.2,1),opacity .35s}.char svg{width:100%;height:100%;overflow:visible}.bear{width:245px;height:300px;left:17%;bottom:18%}.rabbit{width:235px;height:300px;right:17%;bottom:18%}.fox{width:150px;height:185px;right:7%;bottom:8%;z-index:20}.homefox{width:240px;height:290px;left:50%;top:25%;transform:translateX(-50%)}
.walk{left:8%!important;bottom:12%!important;transform:rotate(-3deg) scale(.9)!important}.corner{left:7%!important;bottom:7%!important;transform:rotate(3deg) scale(.72)!important}.tense{transform:rotate(-4deg) scale(1.05);bottom:18%!important}.replayBear{left:20%!important;bottom:18%!important;transform:scale(1)!important}.replayRabbit{right:20%!important;bottom:18%!important;transform:scale(1)!important}
@keyframes float{50%{transform:translateY(-7px)}}@keyframes talk{50%{transform:translateY(-4px)}}@keyframes tremble{25%{transform:translate(-4px,1px) rotate(-3deg)}75%{transform:translate(4px,-1px) rotate(2deg)}}@keyframes hop{50%{transform:translateY(-9px) rotate(2deg)}}.floating{animation:float 3.4s ease-in-out infinite}.talking{animation:talk .45s ease-in-out infinite alternate}.tremble{animation:tremble .28s ease-in-out 4}.hopping{animation:hop .55s ease-in-out 2}
.bubble{position:absolute;z-index:50;background:#fffaf0;padding:13px 22px 15px;border:2px solid var(--pencil);border-radius:47% 53% 51% 46%;font-size:28px;line-height:1.4;box-shadow:4px 5px 0 rgba(100,80,60,.08);opacity:0;transform:scale(.95);transition:.25s;max-width:410px}.bubble.show{opacity:1;transform:scale(1)}.bubble:after{content:"";position:absolute;bottom:-9px;left:24px;width:17px;height:17px;background:#fffaf0;border-right:2px solid var(--pencil);border-bottom:2px solid var(--pencil);transform:rotate(45deg)}.bBear{left:26%;top:13%}.bRabbit{right:25%;top:13%}.bLow{left:13%;top:27%}.bFox{left:10%;top:9%;max-width:450px}
.tap{position:absolute;z-index:70;border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer}.start{left:50%;bottom:10%;transform:translateX(-50%) rotate(-2deg);padding:11px 36px;background:#e9cf98;border:2px solid var(--pencil);border-radius:46% 54% 48% 52%;font-size:31px;box-shadow:5px 6px 0 rgba(100,80,60,.1)}.start:hover{transform:translateX(-50%) rotate(1deg) translateY(-2px)}

/* 观察节点 */
.nodeTitle{position:absolute;z-index:55;top:7%;left:0;right:0;text-align:center;font-size:43px}.foxGuide{position:absolute;z-index:58;left:6%;top:8%;display:flex;align-items:center;gap:10px}.foxGuide .mini{width:90px;height:112px}.foxGuide .words{background:#fffaf0;border:2px solid var(--pencil);border-radius:48%;padding:10px 18px;font-size:24px;max-width:390px}.choices{position:absolute;z-index:70;left:50%;bottom:7%;transform:translateX(-50%);display:flex;gap:17px}.choice{padding:10px 22px;border:2px dashed #9a8773;background:#fffaf0e8;border-radius:47%;font:inherit;font-size:25px;cursor:pointer}.choice:hover{transform:translateY(-3px)}.choice.on{background:var(--yellow);border-style:solid}.feedback{position:absolute;z-index:62;left:50%;top:16%;transform:translateX(-50%);font-size:29px;background:#fffaf0dd;padding:8px 18px;border-radius:50%;opacity:0;transition:.25s}.feedback.show{opacity:1}

.expressionTitle{position:absolute;z-index:60;top:6%;left:0;right:0;text-align:center;font-size:40px}.columns{position:absolute;z-index:65;left:8%;right:8%;bottom:8%;display:grid;grid-template-columns:1fr 1fr;gap:24px}.paperNote{background:#fffaf0dd;border:2px solid #9a8773;border-radius:26px;padding:12px 17px}.paperNote h3{text-align:center;font-size:27px;font-weight:400;margin:0 0 8px}.opts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.opt{padding:7px 14px;border:1.5px solid #aa927d;background:#fffaf0;border-radius:45%;font:inherit;font-size:21px;cursor:pointer}.opt.on{background:var(--yellow)}.sentence{position:absolute;z-index:68;left:50%;bottom:39%;transform:translateX(-50%);width:min(900px,86%);padding:13px 22px;text-align:center;background:#fffaf0ed;border:2px solid var(--pencil);border-radius:47%;font-size:30px;line-height:1.45;min-height:72px}.tell{left:50%;bottom:22%;transform:translateX(-50%);padding:9px 26px;background:#e9cf98;border:2px solid var(--pencil);border-radius:47%;font-size:25px}.hint{position:absolute;z-index:64;top:17%;left:0;right:0;text-align:center;font-size:24px;color:#806f60}
/* 重新来一次：三张真正的小场景插画 */
.restartTitle{position:absolute;z-index:60;top:8%;left:0;right:0;text-align:center;font-size:43px}.sceneChoices{position:absolute;z-index:65;left:6%;right:6%;bottom:7%;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.sceneChoice{height:220px;background:#fffaf0e8;border:2px solid #948170;border-radius:25px;position:relative;overflow:hidden;cursor:pointer}.sceneChoice:hover{transform:translateY(-4px)}.sceneChoice .art{position:absolute;inset:0 0 38px}.sceneChoice .label{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:26px}.result{position:absolute;z-index:62;top:10%;left:50%;transform:translateX(-50%);width:min(850px,88%);text-align:center;font-size:31px;line-height:1.5;background:#fffaf0cc;padding:9px 18px;border-radius:50%}
/* 结尾 */
.endText{position:absolute;z-index:60;top:13%;left:50%;transform:translateX(-50%);width:min(800px,88%);text-align:center;font-size:36px;line-height:1.5}.endSub{position:absolute;z-index:60;top:30%;left:50%;transform:translateX(-50%);font-size:27px;white-space:nowrap}.endButton{position:absolute;z-index:65;bottom:8%;left:50%;transform:translateX(-50%);padding:9px 26px;background:#e9cf98;border:2px solid var(--pencil);border-radius:47%;font:inherit;font-size:24px;cursor:pointer}
@media(max-width:760px){.book{min-height:100svh}.homeTitle{font-size:45px;top:9%}.homeSub{font-size:19px;top:18%}.homefox{width:180px;height:220px;top:24%}.start{font-size:23px}.bear{width:175px;height:215px;left:3%;bottom:17%}.rabbit{width:165px;height:215px;right:2%;bottom:17%}.fox{width:100px;height:125px;right:3%;bottom:8%}.bubble{font-size:20px;max-width:270px;padding:9px 14px}.bBear,.bRabbit{left:5%;right:auto;top:13%}.nodeTitle,.restartTitle{font-size:30px}.foxGuide{left:3%;top:7%}.foxGuide .mini{width:62px;height:78px}.foxGuide .words{font-size:18px;max-width:240px}.choices{gap:5px;bottom:6%}.choice{padding:7px 9px;font-size:18px}.feedback{font-size:21px}.expressionTitle{font-size:29px}.columns{left:3%;right:3%;gap:7px;bottom:6%}.paperNote{padding:8px}.paperNote h3{font-size:20px}.opt{font-size:16px;padding:6px 8px}.sentence{bottom:42%;font-size:21px}.tell{bottom:25%;font-size:20px}.hint{font-size:19px;top:18%}.sceneChoices{left:3%;right:3%;gap:7px}.sceneChoice{height:155px}.sceneChoice .label{font-size:18px}.result{font-size:21px}.endText{font-size:27px}.endSub{font-size:20px;top:31%}.next{font-size:19px}}
</style>

<section class="page" id="p3"><div class="paper"></div><div class="illustration"><svg viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice"><rect width="1200" height="760" fill="var(--sky)"/><path d="M0 420 Q310 360 620 425 T1200 410 V760 H0Z" fill="var(--grass2)"/><path d="M0 535 Q320 475 620 535 T1200 520 V760 H0Z" fill="var(--grass)"/><path d="M92 140 Q145 93 195 138" class="pencil"/><path d="M1000 120 Q1050 80 1095 125" class="pencil"/></svg></div><div id="b3" class="char bear corner"><svg viewBox="0 0 180 190"><use href="#bearArt"/></svg></div><div class="foxGuide"><div class="mini"><svg viewBox="0 0 180 190"><use href="#foxArt"/></svg></div><div class="words">你发现了吗？小熊好像和刚才不一样了。<br>小熊怎么了？</div></div><div id="feedback3" class="feedback"></div><div class="choices"><button class="choice" onclick="emotion('生气')">生气</button><button class="choice" onclick="emotion('难过')">难过</button><button class="choice" onclick="emotion('委屈')">委屈</button><button class="choice" onclick="emotion('不知道')">不知道</button></div><button class="tap next" onclick="go(4)">继续</button></section>

const pages=[null,...Array.from({length:8},(_,i)=>document.getElementById('p'+(i+1)))];
function stopSpeech(){if('speechSynthesis'in window){speechSynthesis.cancel()}storyTimer.forEach(clearTimeout);storyTimer=[];document.querySelectorAll('.bubble').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.char').forEach(x=>x.classList.remove('talking','tremble'))}
function go(n){stopSpeech();page=n;pages[n].classList.add('active');pages.forEach((p,i)=>{if(i&&i!==n)p.classList.remove('active')});if(n===2)playConflict();if(n===3)enterEmotion();if(n===4)playPush();if(n===7)prepareSpeech();}
function startStory(){go(2)}
function say(text,who='fox',delay=0,el=null){return new Promise(resolve=>{const run=()=>{if(el)el.classList.add('show');let target=document.getElementById(who+page);if(target)target.classList.add('talking');if(!('speechSynthesis'in window)){setTimeout(()=>{if(target)target.classList.remove('talking');resolve()},Math.max(1200,text.length*90));return}let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';const voices=speechSynthesis.getVoices();const zh=voices.filter(v=>/zh|CN|Chinese|Mandarin/i.test(v.lang+' '+v.name));if(who==='bear'){u.rate=.82;u.pitch=.78}else if(who==='rabbit'){u.rate=1.03;u.pitch=1.08}else{u.rate=.95;u.pitch=1.22}if(zh.length)u.voice=zh[who==='bear'?Math.min(zh.length-1,1):who==='rabbit'?Math.min(zh.length-1,2):0];u.onend=()=>{if(target)target.classList.remove('talking');resolve()};u.onerror=()=>{if(target)target.classList.remove('talking');resolve()};speechSynthesis.speak(u)};if(delay)storyTimer.push(setTimeout(run,delay));else run()})}
async function playConflict(){
 const b=document.getElementById('b2'),r=document.getElementById('r2'),ball=document.getElementById('ball');
 b.style.left='23%';r.style.right='23%';
 await say('我要玩！','bear',300,document.getElementById('s2a'));
 await say('我先拿到的，你别抢我！','rabbit',180,document.getElementById('s2b'));
 await say('诶……我不玩了，我不要了。','bear',180,document.getElementById('s2c'));
 b.classList.add('walk');
 await new Promise(q=>setTimeout(q,800));
}
function enterEmotion(){document.getElementById('b3').classList.add('corner')}
function emotion(v){const f=document.getElementById('feedback3');f.textContent=v==='不知道'?'没关系，我们可以再看看小熊发生了什么。':'你发现小熊可能有一点'+v+'。';f.classList.add('show');say(f.textContent,'fox',0,null)}
async function playPush(){
 stopSpeech();const b=document.getElementById('b4'),r=document.getElementById('r4');
 b.classList.remove('tense');await say('给我！','bear',250,document.getElementById('s4a'));await say('不要，我先看到的！','rabbit',160,document.getElementById('s4b'));await say('不要抢我……','bear',160,document.getElementById('s4c'));b.classList.add('tense');b.classList.add('tremble');await new Promise(q=>setTimeout(q,700));b.style.left='35%';r.style.right='29%';await new Promise(q=>setTimeout(q,600));await say('啊！','rabbit',100,document.getElementById('s4d'));await say('呜……','bear',180,document.getElementById('s4e'));
}
function reason(t){const f=document.getElementById('s4e');f.textContent='小熊可能是因为'+t.replace('因为','')+'。';f.classList.add('show');say(f.textContent,'fox',0,null)}
function pickFeeling(t,el){feeling=t;document.querySelectorAll('.paperNote:first-child .opt').forEach(x=>x.classList.remove('on'));el.classList.add('on');updateSentence()}
function pickReason(t,el){reasonText=t;document.querySelectorAll('.paperNote:last-child .opt').forEach(x=>x.classList.remove('on'));el.classList.add('on');updateSentence()}
function updateSentence(){document.getElementById('sentence').textContent=feeling&&reasonText?`我感到${feeling}，因为${reasonText}。我们可以一起玩吗？`:'我感到……因为……'}
async function tellBear(){if(!feeling||!reasonText){document.getElementById('sentence').textContent='先选一选，小熊想说什么？';return}const b=document.getElementById('b6');b.classList.add('talking');await say(`我感到${feeling}，因为${reasonText}。我们可以一起玩吗？`,'bear',0,null);b.classList.remove('talking')}
function prepareSpeech(){const text=feeling&&reasonText?`我感到${feeling}，因为${reasonText}。我们可以一起玩吗？`:'我感到有一点委屈，因为我也想玩球。我们可以一起玩吗？';document.getElementById('s7a').textContent=text;setTimeout(()=>speakFinal(text),350)}
async function speakFinal(text){await say(text,'bear',0,document.getElementById('s7a'));await new Promise(q=>setTimeout(q,250));await say('可以呀！那我们一人站一边传球，好不好？','rabbit',0,document.getElementById('s7b'));}
window.speechSynthesis&&speechSynthesis.addEventListener('voiceschanged',()=>{});
</script>
</body></html>
