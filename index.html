<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小狐的心情故事</title>
<style>
:root{--bg:#fff8ed;--ink:#51463f;--muted:#8d7e74;--orange:#ef9850;--orange2:#dc743b;--cream:#fffdf8;--green:#a9c7a0;--blue:#dcecef;--brown:#b9815d;--pink:#e9b8bd;--line:#ead9c8}
*{box-sizing:border-box}body{margin:0;background:#e7e1d8;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;border:0;cursor:pointer;color:inherit}#app{width:min(1080px,100%);margin:auto;min-height:100svh;background:var(--bg)}.page{display:none;min-height:100svh;padding:24px clamp(16px,5vw,58px) 42px;flex-direction:column;gap:13px}.page.active{display:flex}.home{align-items:center;justify-content:center;text-align:center}.home h1{font-size:42px;margin:4px 0}.home p{font-size:20px;color:var(--muted);margin:0 0 16px}.btn{align-self:center;background:var(--orange);color:white;border-radius:30px;padding:14px 34px;min-height:56px;font-weight:800;font-size:20px;box-shadow:0 5px 0 var(--orange2)}.btn:active{transform:translateY(4px);box-shadow:none}.title{text-align:center;font-size:32px;font-weight:900}.sub{text-align:center;color:var(--muted);font-size:18px}.scene{position:relative;min-height:430px;flex:1;overflow:hidden;border-radius:30px;background:linear-gradient(#d9edf0 0 58%,#c7dfb7 58%);box-shadow:0 8px 24px #69584818}.scene:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-12%;height:28%;background:#a8c990;border-radius:50% 50% 0 0}.sun{position:absolute;right:9%;top:8%;width:68px;height:68px;border-radius:50%;background:#f6d37d}.cloud{position:absolute;left:12%;top:14%;width:105px;height:27px;background:#fffdf6aa;border-radius:20px}.cloud:before{content:"";position:absolute;width:44px;height:44px;left:15px;top:-20px;background:#fffdf6aa;border-radius:50%}.char{position:absolute;z-index:5;transition:transform .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 9px 5px #51463f1c)}.char svg{width:100%;height:100%;overflow:visible}.bear{width:190px;height:240px;left:20%;bottom:5%}.rabbit{width:190px;height:240px;right:18%;bottom:5%}.fox{width:155px;height:205px;right:3%;bottom:3%;z-index:8}.ball{position:absolute;width:68px;height:68px;z-index:7;transition:transform .7s cubic-bezier(.2,.8,.2,1)}.ball svg{width:100%;height:100%}.dialog{position:absolute;z-index:12;left:50%;top:20px;transform:translateX(-50%);background:#fffdf8;border-radius:22px;padding:11px 20px;min-width:230px;max-width:78%;text-align:center;font-size:21px;font-weight:700;box-shadow:0 5px 18px #51463f18;opacity:0;transition:.25s}.dialog.show{opacity:1}.tapHint{text-align:center;color:var(--muted);font-size:16px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choice{min-height:108px;background:var(--cream);border:2px solid transparent;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:21px;box-shadow:0 5px 14px #51463f12}.choice .emoji{font-size:40px}.choice.selected{border-color:var(--orange);background:#fff1df;transform:translateY(-3px)}.speech{background:var(--cream);border:2px solid var(--line);border-radius:22px;padding:12px 18px;text-align:center;font-size:20px;line-height:1.45}.build{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.build button{background:var(--cream);border:2px solid transparent;border-radius:23px;min-height:105px;padding:12px;font-weight:800;font-size:20px;box-shadow:0 5px 14px #51463f12}.build button.selected{border-color:var(--orange);background:#fff1df}.sentence{background:#fff0dc;border:2px solid #f1d1ad;border-radius:23px;padding:15px 18px;text-align:center;font-size:26px;font-weight:900;line-height:1.5}.solutions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.solution{background:var(--cream);border:2px solid transparent;border-radius:26px;overflow:hidden;box-shadow:0 6px 16px #51463f12}.solution .pic{height:190px;background:#e8f0e8;display:flex;align-items:center;justify-content:center}.solution svg{width:88%;height:88%}.solution b{display:block;padding:11px;text-align:center;font-size:19px}.solution.selected{border-color:var(--orange);background:#fff1df}.result{background:var(--cream);border-radius:22px;padding:14px 18px;text-align:center;font-size:19px;line-height:1.5}.summary{align-items:center;justify-content:center;text-align:center}.summary h2{font-size:32px}.hide{display:none!important}
/* Core character system: front-facing, balanced silhouettes, thin soft outlines, no permanent tilt. */
svg.ip{width:100%;height:100%}.outline{stroke:#765b4e;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.thin{stroke:#765b4e;stroke-width:1.8;stroke-linecap:round;fill:none}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-13px)}100%{transform:translateY(0)}}@keyframes nod{0%,100%{transform:rotate(0)}40%{transform:rotate(-3deg)}70%{transform:rotate(2deg)}}@keyframes walkCorner{0%{transform:translate(0,0)}55%{transform:translate(-120px,15px) scale(.96)}100%{transform:translate(-135px,35px) scale(.9)}}@keyframes roll{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(260px) rotate(720deg)}}@keyframes speakPop{0%{transform:scale(.96);opacity:.2}100%{transform:scale(1);opacity:1}}.moveHop{animation:hop .65s ease}.moveNod{animation:nod .7s ease}.walkCorner{animation:walkCorner 1.4s cubic-bezier(.2,.75,.25,1) forwards}.roll{animation:roll 1.15s cubic-bezier(.2,.75,.3,1) forwards}.showDialog{animation:speakPop .25s ease}
@media(max-width:720px){.page{padding:18px 13px 35px}.title{font-size:28px}.scene{min-height:400px}.bear,.rabbit{width:145px;height:185px}.bear{left:4%}.rabbit{right:3%}.fox{width:105px;height:140px}.choices{grid-template-columns:1fr 1fr}.solutions{grid-template-columns:1fr}.solution .pic{height:150px}.build button{font-size:18px}.sentence{font-size:22px}.home h1{font-size:34px}}
</style>
</head>
<body>
<div id="app">
<!-- Standard IPs -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="fox" viewBox="0 0 180 220"><path d="M45 75L31 25L70 47Q90 35 110 47L149 25L135 75Q143 91 137 110Q130 137 90 139Q50 137 43 110Q37 91 45 75Z" fill="#ef9850" class="outline"/><path d="M48 112Q90 92 132 112Q127 139 90 145Q53 139 48 112Z" fill="#fff7ed"/><ellipse cx="66" cy="87" rx="6" ry="8" fill="#51463f"/><ellipse cx="114" cy="87" rx="6" ry="8" fill="#51463f"/><circle cx="64" cy="84" r="2" fill="white"/><circle cx="112" cy="84" r="2" fill="white"/><path d="M84 101Q90 96 96 101Q90 108 84 101Z" fill="#51463f"/><path d="M82 114Q90 120 98 114" class="thin"/><path d="M62 139Q52 160 57 194Q72 205 90 199Q108 205 123 194Q128 160 118 139" fill="#ef9850" class="outline"/><path d="M67 146Q90 138 113 146L112 188Q90 196 68 188Z" fill="#9dbcb3"/><path d="M62 150Q40 160 34 184M118 150Q140 160 146 184" class="thin"/><path d="M74 194L68 211M106 194L112 211" class="thin"/></symbol>
<symbol id="bear" viewBox="0 0 180 220"><circle cx="52" cy="53" r="23" fill="#bc895f" class="outline"/><circle cx="128" cy="53" r="23" fill="#bc895f" class="outline"/><ellipse cx="90" cy="92" rx="48" ry="49" fill="#bc895f" class="outline"/><ellipse cx="90" cy="112" rx="25" ry="18" fill="#f2ddc9"/><ellipse cx="72" cy="88" rx="5.5" ry="7" fill="#51463f"/><ellipse cx="108" cy="88" rx="5.5" ry="7" fill="#51463f"/><circle cx="70" cy="85" r="2" fill="white"/><circle cx="106" cy="85" r="2" fill="white"/><ellipse cx="90" cy="105" rx="7" ry="5" fill="#51463f"/><path d="M81 117Q90 125 99 117" class="thin"/><ellipse cx="90" cy="169" rx="55" ry="54" fill="#bc895f" class="outline"/><path d="M49 156Q25 170 21 193M131 156Q155 170 159 193" class="thin"/><path d="M70 207L66 219M110 207L114 219" class="thin"/></symbol>
<symbol id="bearSad" viewBox="0 0 180 220"><use href="#bear"/><path d="M66 88Q72 82 78 88M102 88Q108 82 114 88" class="thin"/><path d="M81 117Q90 110 99 117" class="thin"/><path d="M90 124Q86 132 90 137Q94 132 90 124Z" fill="#9fc7dc"/></symbol>
<symbol id="bearAngry" viewBox="0 0 180 220"><use href="#bear"/><path d="M65 82L79 88M101 88L115 82" class="thin"/><path d="M80 119Q90 109 100 119" class="thin"/></symbol>
<symbol id="rabbit" viewBox="0 0 180 220"><path d="M62 69Q35 13 57 16Q75 22 78 69M118 69Q145 13 123 16Q105 22 102 69" fill="#faf4eb" class="outline"/><path d="M61 39Q53 30 56 53M119 39Q127 30 124 53" fill="none" stroke="#e6aeb5" stroke-width="5"/><ellipse cx="90" cy="94" rx="45" ry="50" fill="#faf4eb" class="outline"/><ellipse cx="90" cy="177" rx="52" ry="50" fill="#faf4eb" class="outline"/><circle cx="73" cy="91" r="5.5" fill="#51463f"/><circle cx="107" cy="91" r="5.5" fill="#51463f"/><circle cx="72" cy="88" r="2" fill="white"/><circle cx="106" cy="88" r="2" fill="white"/><path d="M84 106Q90 101 96 106Q90 113 84 106Z" fill="#51463f"/><path d="M82 119Q90 125 98 119" class="thin"/><path d="M57 157Q33 172 27 194M123 157Q147 172 153 194" class="thin"/><path d="M71 211L67 220M109 211L113 220" class="thin"/></symbol>
<symbol id="teacher" viewBox="0 0 180 220"><circle cx="90" cy="64" r="38" fill="#e8b991" class="outline"/><path d="M52 62Q55 20 90 23Q125 20 128 62Q112 43 90 45Q68 43 52 62Z" fill="#765c50"/><circle cx="76" cy="66" r="4" fill="#51463f"/><circle cx="104" cy="66" r="4" fill="#51463f"/><path d="M82 83Q90 89 98 83" class="thin"/><path d="M52 108Q90 91 128 108L145 211H35Z" fill="#8fb7ad" class="outline"/><path d="M70 110L90 137L110 110" fill="#fffdf8"/><path d="M90 137V200" class="thin"/></symbol>
</defs></svg>
<section class="page home active" id="p1"><svg style="width:210px;height:255px"><use href="#fox"/></svg><h1>小狐的心情故事</h1><p>你好，我是小狐</p><button class="btn" onclick="start()">开始故事</button></section>
<section class="page" id="p2"><div class="title">一起玩吧</div><div class="sub">下午，幼儿园的操场上</div><div class="scene" id="scene2"><div class="sun"></div><div class="cloud"></div><div class="dialog" id="d2"></div><div class="char bear" id="b2"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r2"><svg><use href="#rabbit"/></svg></div><div class="ball" id="ball2" style="left:44%;bottom:30%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fff" class="outline"/><path d="M25 21L35 16L46 23L42 35L29 35Z" fill="#8fb8ad"/><path d="M25 21L15 31M46 23L55 33M29 35L22 49M42 35L49 49" class="thin"/></svg></div></div><div class="tapHint">看看发生了什么……</div><button class="btn hide" id="n2" onclick="go(3)">继续</button></section>
<section class="page" id="p3"><div class="title">发生了什么？</div><div class="sub">小熊和小兔都想玩这个球</div><div class="scene"><div class="dialog" id="d3"></div><div class="char bear" id="b3" style="left:24%;bottom:7%"><svg><use href="#bear"/></svg></div><div class="char rabbit" id="r3" style="right:22%;bottom:7%"><svg><use href="#rabbit"/></svg></div><div class="ball" id="ball3" style="left:46%;bottom:30%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fff" class="outline"/><path d="M25 21L35 16L46 23L42 35L29 35Z" fill="#8fb8ad"/><path d="M25 21L15 31M46 23L55 33M29 35L22 49M42 35L49 49" class="thin"/></svg></div></div><button class="btn" onclick="startArgument()">继续看看</button></section>
<section class="page" id="p4"><div class="title">小熊怎么了？</div><div class="sub">刚才还在一起玩，现在小熊一个人坐在角落</div><div class="scene"><div class="dialog" id="d4"></div><div class="char bear" id="b4" style="left:9%;bottom:0"><svg><use href="#bearSad"/></svg></div><div class="char rabbit" style="right:13%;bottom:7%"><svg><use href="#rabbit"/></svg></div><div class="ball" style="right:18%;bottom:31%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fff" class="outline"/><path d="M25 21L35 16L46 23L42 35L29 35Z" fill="#8fb8ad"/></svg></div><div class="char fox"><svg><use href="#fox"/></svg></div></div><div class="speech" id="p4s">小狐：你发现小熊的心情变了吗？</div><div class="choices"><button class="choice" onclick="pickEmotion('生气',this)"><span class="emoji">😠</span>生气</button><button class="choice" onclick="pickEmotion('难过',this)"><span class="emoji">😢</span>难过</button><button class="choice" onclick="pickEmotion('委屈',this)"><span class="emoji">🥺</span>委屈</button><button class="choice" onclick="pickEmotion('不知道',this)"><span class="emoji">🤔</span>不知道</button></div><button class="btn hide" id="n4" onclick="go(5)">继续</button></section>
<section class="page" id="p5"><div class="title">帮小熊说出来</div><div class="sub">先说说自己的感觉</div><div class="scene" style="min-height:255px;flex:none"><div class="char bear" style="left:30%;bottom:-5%"><svg><use href="#bearSad"/></svg></div><div class="char fox"><svg><use href="#fox"/></svg></div></div><div class="build"><button id="feeling" onclick="chooseFeeling()">我感到有一点<span id="feelingWord">难过</span></button><button id="reason" onclick="chooseReason()">因为我也想玩球</button></div><div class="sentence" id="sentence">我感到有一点难过，因为我也想玩球。<br>我们可以一起玩吗？</div><button class="btn" onclick="tellRabbit()">告诉小兔</button><button class="btn hide" id="n5" onclick="go(6)">继续</button></section>
<section class="page" id="p6"><div class="title">小熊说完以后</div><div class="sub">看看小兔会怎么回应</div><div class="scene"><div class="dialog" id="d6"></div><div class="char bear" id="b6" style="left:20%;bottom:6%"><svg><use href="#bearSad"/></svg></div><div class="char rabbit" id="r6" style="right:20%;bottom:6%"><svg><use href="#rabbit"/></svg></div><div class="ball" style="left:47%;bottom:28%"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="#fff" class="outline"/><path d="M25 21L35 16L46 23L42 35L29 35Z" fill="#8fb8ad"/></svg></div></div><button class="btn hide" id="n6" onclick="go(7)">继续</button></section>
<section class="page" id="p7"><div class="title">后来发生了什么？</div><div class="sub">如果重新来一次，小熊可以怎么做？</div><div class="solutions"><button class="solution" onclick="solve(1,this)"><div class="pic"><svg viewBox="0 0 180 150"><use href="#bear" transform="translate(0 0) scale(.68)"/><path d="M105 75Q130 55 151 75" class="thin"/><circle cx="142" cy="55" r="16" fill="#f6d37d"/></svg></div><b>先停一停</b></button><button class="solution" onclick="solve(2,this)"><div class="pic"><svg viewBox="0 0 180 150"><use href="#bear" transform="translate(-25 12) scale(.55)"/><use href="#rabbit" transform="translate(92 12) scale(.55)"/><path d="M76 57Q90 42 104 57" class="thin"/></svg></div><b>说出自己的感觉</b></button><button class="solution" onclick="solve(3,this)"><div class="pic"><svg viewBox="0 0 180 150"><use href="#bear" transform="translate(-12 18) scale(.52)"/><use href="#teacher" transform="translate(75 5) scale(.52)"/></svg></div><b>找老师帮忙</b></button></div><div class="result hide" id="result"></div><button class="btn hide" id="n7" onclick="go(8)">继续</button></section>
<section class="page" id="p8"><div class="title">小狐的小结</div><svg style="width:180px;height:220px;align-self:center"><use href="#fox"/></svg><div class="sentence">我可以生气。<br>我也可以说出自己的感觉。<br>然后一起想办法。</div><button class="btn" onclick="go(1)">再玩一次</button></section>
</div>
<script>
let emotion='难过';
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.9;u.pitch=1.08;speechSynthesis.speak(u)}}
function show(id,text){let e=document.getElementById(id);e.textContent=text;e.classList.add('show','showDialog');speak(text)}
function go(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p'+n).classList.add('active');window.scrollTo(0,0)}
function start(){go(2);setTimeout(()=>{show('d2','小兔：我们来玩球吧！');document.getElementById('r2').classList.add('moveHop');setTimeout(()=>{show('d2','小熊：好呀！');document.getElementById('b2').classList.add('moveHop')},900);setTimeout(()=>{document.getElementById('ball2').classList.add('roll')},1700);setTimeout(()=>{show('d2','小兔：咦？球滚过来了！');document.getElementById('n2').classList.remove('hide')},2700)},300)}
function startArgument(){go(3);setTimeout(()=>{show('d3','小熊：这个球是我的，我也想玩！');document.getElementById('b3').classList.add('moveHop')},400);setTimeout(()=>{show('d3','小兔：可是我还没有玩完呀！');document.getElementById('r3').classList.add('moveHop')},1500);setTimeout(()=>{show('d3','小熊：我不玩了！');document.getElementById('b3').classList.add('walkCorner')},2600);setTimeout(()=>{go(4);setTimeout(()=>show('d4','小狐：小熊怎么了？'),300)},3900)}
function pickEmotion(v,el){emotion=v;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');let words={生气:'小熊好像有一点生气。',难过:'小熊好像有一点难过。',委屈:'小熊好像有一点委屈。',不知道:'没关系，我们再看看。'};document.getElementById('p4s').textContent='小狐：'+words[v];document.getElementById('n4').classList.remove('hide');speak(words[v])}
function chooseFeeling(){let w=emotion==='不知道'?'难过':emotion;document.getElementById('feelingWord').textContent=w;speak('我感到有一点'+w)}
function chooseReason(){speak('因为我也想玩球')}
function tellRabbit(){go(6);setTimeout(()=>{show('d6','小熊：我感到有一点'+(emotion==='不知道'?'难过':emotion)+'，因为我也想玩球。我们可以一起玩吗？');document.getElementById('b6').classList.add('moveNod')},400);setTimeout(()=>{show('d6','小兔：可以呀！我不知道你也想玩。');document.getElementById('r6').classList.add('moveHop')},2300);setTimeout(()=>{document.getElementById('n6').classList.remove('hide')},3500)}
function solve(n,el){document.querySelectorAll('.solution').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');let r=document.getElementById('result');r.classList.remove('hide');if(n===1)r.innerHTML='小熊先停下来，等一等。<br>等自己不那么急了，再说自己的感觉。';if(n===2)r.innerHTML='小熊说出自己的感觉，也告诉小兔自己想玩球。<br>两个小伙伴一起想办法。';if(n===3)r.innerHTML='小熊不知道怎么办，可以请老师来帮忙。';speak(r.innerText);document.getElementById('n7').classList.remove('hide')}
</script>
</body></html>
