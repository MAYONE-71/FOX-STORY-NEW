</div>
<script>
let ctx=null;function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f=620,d=.09){const c=audio(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02)}function clickSound(){tone(650,.07)}function good(){tone(720,.08);setTimeout(()=>tone(920,.1),80)}function speak(t){clickSound();if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.88;u.pitch=1.08;speechSynthesis.speak(u)}}function go(n,voice){clickSound();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const p=document.getElementById('p'+n);p.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});if(voice)setTimeout(()=>speak(voice),180)}function startStory(){audio();good();go(2,'下午，幼儿园的操场上，小熊和小兔一起玩球。')}function tapChar(el,text){el.classList.remove('tap');void el.offsetWidth;el.classList.add('tap');good();speak(text)}function tapBall(el){el.classList.remove('tap');void el.offsetWidth;el.classList.add('tap');speak('球滚过来啦！')}function foxTap(el,text){el.classList.remove('tap');void el.offsetWidth;el.classList.add('tap');good();speak(text)}function emotion(v,el){clickSound();document.querySelectorAll('#p3 .choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const m={生气:'你发现小熊可能有一点生气。',难过:'你发现小熊可能有一点难过。',委屈:'你发现小熊可能有一点委屈。',不知道:'没关系，我们可以再看看。'}[v];document.getElementById('p3text').textContent='小狐：'+m;speak(v);document.getElementById('p3next').classList.remove('hide')}function chooseBuild(which){clickSound();document.getElementById(which==='emo'?'emoBtn':'reasonBtn').classList.toggle('selected');const a=document.getElementById('emoBtn').classList.contains('selected'),b=document.getElementById('reasonBtn').classList.contains('selected');if(a&&b){document.getElementById('sentence').innerHTML='我感到<span>一点委屈</span>，因为<span>我也想玩球</span>。';document.getElementById('requestBtn').classList.remove('hide');good();speak('我感到一点委屈，因为我也想玩球。')}}function readSentence(){const s=document.getElementById('sentence').innerText;if(s==='我感到……')speak('先点上面的两个小卡片。');else speak(s)}function showRequest(){document.getElementById('requestText').classList.remove('hide');document.getElementById('p4next').classList.remove('hide');good();speak('我们可以一起玩吗？')}function solution(n,el){document.querySelectorAll('.solution').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const r=document.getElementById('result');r.classList.remove('hide');document.getElementById('p6next').classList.remove('hide');if(n===1){r.innerHTML='小熊先停下来，不推人。<br>等心里没有那么急了，再说自己的感觉。';speak('小熊先停下来，不推人。')}if(n===2){r.innerHTML='小熊说：“我感到一点委屈，因为我也想玩球。我们可以一起玩吗？”<br>小兔说：“好呀！”';good();speak('我感到一点委屈，因为我也想玩球。我们可以一起玩吗？')}if(n===3){r.innerHTML='小熊可以请老师来帮忙。<br>不知道怎么办的时候，找大人帮忙也可以。';speak('不知道怎么办的时候，找大人帮忙也可以。')}}
</script>
</body></html>
