<section class="page active" id="p1"><div class="book"><div class="paperNoise"></div><div class="scene"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hill"></div><div class="floor"></div><svg class="doodle" viewBox="0 0 1000 700"><path d="M100 580q120-70 240 0M650 570q120-60 250 0"/><path d="M180 210q30-30 60 0M720 190q35-28 68 2"/></svg></div><div class="homeTitle">小狐的心情故事</div><div class="homeHint">你好，我是小狐</div><svg style="position:absolute;width:150px;height:180px;left:50%;top:30%;transform:translateX(-50%);z-index:8" viewBox="0 0 220 260"><use href="#fox"/></svg><button class="start" onclick="go(2)">开始故事</button></div></section>
<section class="page" id="p2"><div class="book"><div class="paperNoise"></div><div class="topTitle">一起玩吧</div><div class="scene"><div class="sun"></div><div class="cloud c1"></div><div class="hill"></div><div class="floor"></div><div class="storyArt"><div class="toy block"></div><div class="toy book"></div><svg class="char bear" viewBox="0 0 220 260"><use href="#bear"/></svg><svg class="char rabbit" viewBox="0 0 220 260"><use href="#rabbit"/></svg><div class="ball" id="ball"></div></div></div><div class="dialogue" id="d2"></div><div class="actionPrompt" id="a2">看看发生了什么……</div><button class="continue hide" id="c2" onclick="go(3)">继续</button></div></section>
<section class="page" id="p3"><div class="book"><div class="paperNoise"></div><div class="topTitle">发生了一点小事</div><div class="scene"><div class="sun"></div><div class="hill"></div><div class="floor"></div><div class="storyArt"><svg class="char bear" id="bear3" viewBox="0 0 220 260"><use href="#bear"/></svg><svg class="char rabbit" id="rabbit3" viewBox="0 0 220 260"><use href="#rabbit"/></svg><div class="ball" style="left:47%;bottom:32%"></div></div></div><div class="dialogue" id="d3"></div><button class="continue hide" id="c3" onclick="go(4)">继续</button></div></section>
<section class="page" id="p4"><div class="book"><div class="paperNoise"></div><div class="topTitle">你发现了吗？</div><div class="scene"><div class="sun"></div><div class="hill"></div><div class="floor"></div><div class="storyArt"><svg class="char bear" id="bear4" viewBox="0 0 220 260"><use href="#bear"/></svg><svg class="char rabbit" id="rabbit4" viewBox="0 0 220 260"><use href="#rabbit"/></svg></div></div><div class="node"><div class="nodeBox"><svg class="nodeFox" viewBox="0 0 220 260"><use href="#fox"/></svg><div class="nodeText">小熊好像和刚才不一样了。<br>你觉得小熊怎么了？</div><div class="emotionChoices"><button onclick="emotion('生气',this)">生气</button><button onclick="emotion('难过',this)">难过</button><button onclick="emotion('委屈',this)">委屈</button><button onclick="emotion('不知道',this)">不知道</button></div></div></div></div></section>
<section class="page" id="p5"><div class="book"><div class="paperNoise"></div><div class="scene"><div class="sun"></div><div class="hill"></div><div class="floor"></div><div class="storyArt"><svg class="char bear" viewBox="0 0 220 260"><use href="#bear"/></svg><svg class="char rabbit" viewBox="0 0 220 260"><use href="#rabbit"/></svg></div></div><div class="builder"><div class="builderTitle">帮小熊说一说</div><div class="builderCols"><div class="builderCol"><h3>我感到……</h3><div class="opts" id="feel"><button onclick="pickFeel('有一点生气',this)">有一点生气</button><button onclick="pickFeel('有一点难过',this)">有一点难过</button><button onclick="pickFeel('有一点委屈',this)">有一点委屈</button></div></div><div class="builderCol"><h3>因为……</h3><div class="opts" id="why"><button onclick="pickWhy('因为我也想玩球',this)">我也想玩球</button><button onclick="pickWhy('因为我的想法没有被听见',this)">我的想法没有被听见</button><button onclick="pickWhy('因为我觉得不公平',this)">我觉得不公平</button></div></div></div><div class="sentence" id="sentence">我感到……，因为……</div><button class="speakBtn" id="tellBtn" onclick="tellRabbit()">告诉小兔</button></div></div></section>
<section class="page" id="p6"><div class="book"><div class="paperNoise"></div><div class="topTitle">听见对方的话</div><div class="scene"><div class="sun"></div><div class="hill"></div><div class="floor"></div><div class="storyArt"><svg class="char bear" id="bear6" viewBox="0 0 220 260"><use href="#bear"/></svg><svg class="char rabbit" id="rabbit6" viewBox="0 0 220 260"><use href="#rabbit"/></svg><div class="ball" style="left:47%;bottom:32%"></div></div></div><div class="dialogue" id="d6"></div><button class="continue hide" id="c6" onclick="go(7)">继续</button></div></section>
<section class="page" id="p7"><div class="book"><div class="paperNoise"></div><div class="scene"><div class="sun"></div><div class="hill"></div><div class="floor"></div><div class="storyArt"><svg class="char bear" id="bear7" viewBox="0 0 220 260"><use href="#bear"/></svg><svg class="char rabbit" id="rabbit7" viewBox="0 0 220 260"><use href="#rabbit"/></svg></div></div><div class="solChoice"><div class="solTitle">如果重新来一次，你会怎么做？</div><div class="sols"><button class="sol" onclick="solution(1,this)"><div class="solArt"><svg viewBox="0 0 220 130"><ellipse cx="110" cy="112" rx="100" ry="22" fill="#cbd4ad"/><circle cx="82" cy="70" r="28" fill="#ad866b" stroke="#68584e" stroke-width="3"/><path d="M62 50q20-25 40 0M69 74q13 10 26 0" class="soft"/><path d="M112 80q30 8 43 25" class="soft"/></svg></div><label>停下来，等一等</label></button><button class="sol" onclick="solution(2,this)"><div class="solArt"><svg viewBox="0 0 220 130"><ellipse cx="110" cy="112" rx="100" ry="22" fill="#cbd4ad"/><circle cx="74" cy="74" r="28" fill="#ad866b" stroke="#68584e" stroke-width="3"/><circle cx="148" cy="74" r="28" fill="#f5ecdd" stroke="#68584e" stroke-width="3"/><path d="M99 76q17-20 33 0" class="soft"/><path d="M62 96q14-16 27 0M137 96q14-16 27 0" class="soft"/></svg></div><label>把感觉说出来</label></button><button class="sol" onclick="solution(3,this)"><div class="solArt"><svg viewBox="0 0 220 130"><ellipse cx="110" cy="112" rx="100" ry="22" fill="#cbd4ad"/><circle cx="80" cy="78" r="27" fill="#ad866b" stroke="#68584e" stroke-width="3"/><rect x="137" y="47" width="35" height="52" rx="10" fill="#d9a9a7" stroke="#68584e" stroke-width="3"/><path d="M105 77q16-10 29 0" class="soft"/></svg></div><label>找老师帮忙</label></button></div><div class="dialogue" id="d7"></div><button class="continue hide" id="c7" onclick="go(8)">继续</button></div></div></section>
<section class="page" id="p8"><div class="book summaryPage"><div><svg style="width:130px;height:155px" viewBox="0 0 220 260"><use href="#fox"/></svg><h2>今天，你帮助了小熊</h2><p>看见感觉<br>说出感觉和原因<br>再想一个不伤害别人的办法</p><button class="restart" onclick="go(1)">再玩一次</button></div></div></section>

<script>

function go(n){speechSynthesis.cancel();clearTimeout(speechTimer);current=n;pages.forEach((p,i)=>p.classList.toggle('active',i===n-1));window.scrollTo(0,0);if(n===2)scene2();if(n===3)scene3();if(n===6)scene6()}

function scene2(){const b=document.getElementById('ball'),d=document.getElementById('d2'),a=document.getElementById('a2'),c=document.getElementById('c2');b.classList.remove('rolling');d.classList.remove('show');a.classList.remove('show');c.classList.add('hide');setTimeout(()=>{b.classList.add('rolling');setTimeout(()=>{show('d2','小熊：<br>这个球是我的！');speak('这个球是我的！','bear',()=>setTimeout(()=>{show('d2','小兔：<br>我也要玩！');speak('我也要玩！','rabbit',()=>setTimeout(()=>{a.classList.add('show');c.classList.remove('hide')},700))},650))},1200)},350)}
function scene3(){const b=document.getElementById('bear3'),d=document.getElementById('d3'),c=document.getElementById('c3');b.classList.remove('walking','crouching');d.classList.remove('show');c.classList.add('hide');setTimeout(()=>{show('d3','小熊：<br>给我！');speak('给我！','bear',()=>setTimeout(()=>{show('d3','小兔：<br>不要，我先看到的！');speak('不要，我先看到的！','rabbit',()=>setTimeout(()=>{show('d3','小熊：<br>诶，我不玩了……我不要了。');speak('诶，我不玩了，我不要了。','bear',()=>setTimeout(()=>{b.classList.add('walking');setTimeout(()=>{b.classList.remove('walking');b.classList.add('crouching');setTimeout(()=>{d.classList.remove('show');c.classList.remove('hide')},900)},1250)},450))},650)})},650)})},400)}
function emotion(v,btn){document.querySelectorAll('.emotionChoices button').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');speak(v==='不知道'?'没关系，我们可以再看看小熊发生了什么。':`你发现小熊可能有一点${v}。`,'fox',()=>setTimeout(()=>go(5),650))}
function pickFeel(v,b){feel=v;document.querySelectorAll('#feel button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');updateSentence()}
function pickWhy(v,b){why=v;document.querySelectorAll('#why button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');updateSentence()}
function updateSentence(){document.getElementById('sentence').textContent=feel&&why?`我感到${feel.replace('有一点','有一点')}，${why}。我们可以一起玩吗？`:'我感到……，因为……'}
function tellRabbit(){if(!feel||!why){speak('先选一选小熊的感觉和原因吧。','fox');return}document.getElementById('tellBtn').textContent='小熊说话中……';speak(document.getElementById('sentence').textContent,'bear',()=>setTimeout(()=>go(6),700))}
function scene6(){const d=document.getElementById('d6'),c=document.getElementById('c6');d.classList.remove('show');c.classList.add('hide');speak(document.getElementById('sentence').textContent,'bear',()=>{show('d6','小兔：<br>可以呀！那我们一人站一边传球，好不好？');speak('可以呀！那我们一人站一边传球，好不好？','rabbit',()=>setTimeout(()=>c.classList.remove('hide'),800))})}
function solution(n,btn){document.querySelectorAll('.sol').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');const t=n===1?'先停下来，等一等，身体会慢慢放松。':n===2?'把感觉和原因说出来，让别人听见自己的想法。':'找老师帮忙，一起想办法。';show('d7',t);speak(t,'fox',()=>setTimeout(()=>document.getElementById('c7').classList.remove('hide'),500))}
window.addEventListener('load',()=>speechSynthesis.getVoices());
